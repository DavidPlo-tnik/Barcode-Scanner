<!-- ZXing barcode scanner: works reliably on iOS Safari & Android Chrome -->
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- JsBarcode for rendering barcodes in lists -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<!-- jsPDF for direct PDF generation of labels (bypasses browser print which is unreliable on mobile) -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
(() => {
  'use strict';

  let DATA = null;
  let codeReader = null;
  let scanControls = null;
  let lastScanCode = null;
  let lastScanTime = 0;
  const RECENT_KEY = 'decarie_recent_v1';
  const LISTS_KEY = 'decarie_lists_v1';
  let chart = null;
  let currentProductCode = null;
  let currentListId = null;

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const monthLabel = (m) => {
    const [y, mo] = m.split('-');
    const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${names[parseInt(mo, 10) - 1]} ${y.slice(2)}`;
  };

  const fmtMoney = (v) => {
    if (v === 0) return '$0';
    if (v < 100) return `$${v.toFixed(2)}`;
    return `$${Math.round(v).toLocaleString()}`;
  };

  const fmtQty = (v) => {
    if (v === 0) return '0';
    if (v < 1) return v.toFixed(2);
    if (v % 1 === 0) return Math.round(v).toLocaleString();
    return v.toFixed(1);
  };

  const showToast = (msg, isErr = false) => {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  };

  const setStatus = (msg, kind = '') => {
    const s = $('#status');
    s.textContent = msg;
    s.className = 'scanner-status' + (kind ? ' ' + kind : '');
  };

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  // ============== DATA ==============
  async function loadData() {
    try {
      // Cache-bust with current minute so service worker / browser can't serve
      // a stale data.json. Combined with SW's network-first policy for data.json,
      // this guarantees a fresh fetch when online.
      const cacheBust = Math.floor(Date.now() / 60000); // changes every minute
      const res = await fetch(`data.json?v=${cacheBust}`);
      DATA = await res.json();
      $('#meta-info').textContent = `${Object.keys(DATA.products).length.toLocaleString()} ITEMS`;
      // Show last-updated and partial-month info
      const updatedLine = $('#updated-line');
      if (updatedLine) {
        const updated = DATA.updated || 'unknown';
        const partials = DATA.partial_months || {};
        const partialKeys = Object.keys(partials);
        let liveBit = '';
        if (partialKeys.length) {
          const k = partialKeys[partialKeys.length - 1];
          const p = partials[k];
          liveBit = `<span class="live">${monthLabel(k).toUpperCase()} ${p.days}/${p.total} DAYS</span>`;
        }
        updatedLine.innerHTML = `<span>DATA · ${updated}</span>${liveBit}`;
      }
      return true;
    } catch (e) {
      console.error('Failed to load data:', e);
      $('#meta-info').textContent = 'DATA ERROR';
      return false;
    }
  }

  // ============== LOOKUP ==============
  // Scale-printed barcodes from the store scale:
  // Format: 20XXXXXPPPPPC  (13 digits)
  //   20      = scale prefix (EAN-13 internal use)
  //   XXXXX   = product PLU (5 digits, positions 2-6)
  //   PPPPPP  = encoded weight/price (positions 7-12)
  //   C       = optional check digit
  // POS stores these as 20 + PLU + 6 zeros (12 digits with check) or with trailing zeros stripped (11 digits).
  // To match: detect 13-digit code starting with "20", extract PLU, look up "20XXXXX0000" (11d) or "20XXXXX00000" (12d).
  function lookup(code) {
    if (!DATA) return null;
    const raw = String(code).trim();

    const candidates = [];
    const seen = new Set();
    const add = (c) => { if (c && !seen.has(c)) { seen.add(c); candidates.push(c); } };

    // SCALE BARCODE detection:
    // Marché Décarie scale prints 13-digit EAN-13 barcodes with format:
    //   2 PPPPP WWWWW C   where:
    //     2     = scale prefix (single digit)
    //     PPPPP = 5-digit product PLU (positions 1-5)
    //     WWWWW = encoded weight/price (positions 6-10)
    //     C     = check digit
    // The POS stores these as 2 + PLU + zeros, trimmed of trailing zeros
    // (e.g. "20233300000" = 11 digits for PEPPERETTE DU BOEUF, PLU=02333).
    // To match: detect any code starting with '2' that's >= 12 digits,
    // extract PLU from positions 1-5, look up "2" + PLU + variable trailing zeros.
    if (/^2\d{11,12}$/.test(raw)) {
      const plu = raw.slice(1, 6); // 5-digit PLU
      // Try various POS storage lengths (11, 12, 13 digits)
      add('2' + plu + '00000');   // 11-digit (most common in POS)
      add('2' + plu + '000000');  // 12-digit
      add('2' + plu + '0000000'); // 13-digit
      add('2' + plu + '0000');    // 10-digit fallback
    }

    add(raw);
    // Strip trailing check digit (UPC-A 12→11, EAN-13 13→12)
    if (raw.length >= 8) add(raw.slice(0, -1));
    // Strip leading zeros
    const noLead = raw.replace(/^0+/, '');
    if (noLead) add(noLead);
    if (noLead.length >= 8) add(noLead.slice(0, -1));
    // EAN-13 → UPC-A: drop leading 0
    if (raw.length === 13 && raw.startsWith('0')) {
      add(raw.slice(1));
      add(raw.slice(1, -1));
    }
    // Pad to 13 digits (SQL data stores all codes zero-padded to 13)
    add(raw.padStart(13, '0'));
    if (raw.length >= 8) add(raw.slice(0, -1).padStart(13, '0'));
    // Legacy single-zero pad
    add('0' + raw);

    for (const c of candidates) {
      const resolved = resolveCode(c);
      if (DATA.products[resolved]) return { code: resolved, scanned: raw, ...packProduct(resolved) };
    }
    return null;
  }

  function packProduct(code) {
    code = resolveCode(code);
    const arr = DATA.products[code];
    // Schema: [name, price, dept_code, margin_pct, unit_cost, case_cost, units_per_case, multipack, depuis, taxed, size_str]
    const [name, price, deptCode, marginPct, unitCost, caseCost, unitsPerCase, multipack, depuis, taxed, sizeStr] = arr;
    const sales = DATA.sales[code] || null;
    const dept = (deptCode != null && DATA.depts) ? DATA.depts[String(deptCode)] : null;
    return {
      name, price, dept, deptCode,
      marginPct, unitCost, caseCost, unitsPerCase,
      multipack, depuis, sales,
      sizeStr: sizeStr || '',
      taxed: !!taxed,
      fmt: '',
    };
  }

  // Normalize a barcode to match whatever format data.json uses.
  // Old data.json had codes without leading zeros; new SQL data has 13-digit
  // zero-padded codes. This function tries the stored code as-is, then
  // padded to 13 digits, then with all leading zeros stripped — so existing
  // inventory lists and fresh scans both resolve correctly.
  function resolveCode(rawCode) {
    if (!rawCode || !DATA || !DATA.products) return rawCode;
    if (DATA.products[rawCode]) return rawCode;
    const padded = rawCode.padStart(13, '0');
    if (DATA.products[padded]) return padded;
    const stripped = rawCode.replace(/^0+/, '') || '0';
    if (DATA.products[stripped]) return stripped;
    return rawCode; // not found — return original
  }

  // ============== RECENT ==============
  function getRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
    catch { return []; }
  }
  function pushRecent(code) {
    const list = getRecent().filter((c) => c !== code);
    list.unshift(code);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 10)));
    renderRecent();
  }
  function renderRecent() {
    const list = getRecent();
    const container = $('#recent-section');
    const ul = $('#recent-list');
    if (list.length === 0) { container.style.display = 'none'; return; }
    container.style.display = 'block';
    ul.innerHTML = '';
    for (const code of list) {
      const p = lookup(code);
      if (!p) continue;
      const li = document.createElement('div');
      li.className = 'recent-item';
      const wkAmt = p.sales ? fmtMoney(p.sales.wka) + '/wk' : '—';
      li.innerHTML = `<div class="rname">${escapeHtml(p.name)}</div><div class="ramt">${wkAmt}</div>`;
      li.addEventListener('click', () => openProduct(code));
      ul.appendChild(li);
    }
  }

  // ============== SCANNER (ZXing — works on iOS Safari) ==============
  // Cached list of back-facing camera devices, in priority order
  let backCameras = [];
  let currentCameraIndex = 0;
  const CAMERA_PREF_KEY = 'decarie_camera_pref_v1';

  // Score a camera label to find the "main" rear camera.
  // Samsung phones with multi-camera setups expose ALL back cameras to the browser,
  // and the default pick is often the ultrawide or telephoto — neither of which
  // can focus close enough to read a barcode held ~6 inches away.
  // Higher score = more likely to be the main wide-angle camera.
  function scoreCameraLabel(label) {
    const l = (label || '').toLowerCase();
    let score = 0;
    // Penalize known "wrong" cameras heavily
    if (/ultra.?wide|wide.?angle|0\.5x|0\.6x/.test(l)) score -= 100;
    if (/tele|zoom|3x|5x|10x/.test(l)) score -= 80;
    if (/depth|macro|monochrome|mono/.test(l)) score -= 80;
    if (/front|user|selfie/.test(l)) score -= 200;
    // Reward back-camera signals
    if (/back|rear|environment/.test(l)) score += 50;
    // The "main" camera on Samsung is often called "camera2 0" or just numbered "0"
    if (/camera2?\s*0\b|^0$|\b0,/.test(l)) score += 30;
    return score;
  }

  async function enumerateCameras() {
    try {
      // First request permission so labels are populated
      const tempStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      });
      tempStream.getTracks().forEach(t => t.stop());
    } catch (e) {
      console.warn('Initial getUserMedia failed:', e);
    }

    const devices = await navigator.mediaDevices.enumerateDevices();
    const allVideo = devices.filter(d => d.kind === 'videoinput');

    // Filter to back cameras only (or all if labels are empty / not available)
    let backs = allVideo.filter(d => {
      const l = (d.label || '').toLowerCase();
      return !/front|user|selfie/.test(l);
    });
    if (backs.length === 0) backs = allVideo;

    // Sort by score, highest first (best main camera at index 0)
    backs.sort((a, b) => scoreCameraLabel(b.label) - scoreCameraLabel(a.label));
    return backs;
  }

  async function startScanner() {
    if (codeReader) return;
    if (!window.ZXingBrowser) {
      setStatus('SCANNER LIBRARY FAILED TO LOAD', 'err');
      return;
    }
    setStatus('STARTING CAMERA…');
    $('#start-btn').disabled = true;
    try {
      const videoEl = $('#scanner-video');
      codeReader = new ZXingBrowser.BrowserMultiFormatReader();

      // Enumerate back cameras (first call may need permission grant)
      if (backCameras.length === 0) {
        backCameras = await enumerateCameras();
      }

      // Restore previously chosen camera if available
      const savedId = localStorage.getItem(CAMERA_PREF_KEY);
      if (savedId) {
        const idx = backCameras.findIndex(d => d.deviceId === savedId);
        if (idx >= 0) currentCameraIndex = idx;
      }

      await startWithCurrentCamera(videoEl);
      updateCameraButton();
    } catch (e) {
      console.error('Scanner start error:', e);
      let msg = 'CAMERA ERROR';
      if (e && e.name === 'NotAllowedError') msg = 'CAMERA PERMISSION DENIED';
      else if (e && e.name === 'NotFoundError') msg = 'NO CAMERA FOUND';
      else if (e && e.message) msg = 'ERR: ' + e.message.toUpperCase().slice(0, 40);
      setStatus(msg, 'err');
      $('#start-btn').disabled = false;
      codeReader = null;
      scanControls = null;
    }
  }

  async function startWithCurrentCamera(videoEl) {
    // Stop any existing stream first
    if (scanControls) {
      try { scanControls.stop(); } catch (e) {}
      scanControls = null;
    }
    if (videoEl.srcObject) {
      videoEl.srcObject.getTracks().forEach(t => t.stop());
      videoEl.srcObject = null;
    }

    const cam = backCameras[currentCameraIndex];
    // Higher-resolution request helps autofocus on barcodes
    const videoConstraints = cam
      ? {
          deviceId: { exact: cam.deviceId },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          // Hint for focus mode (supported on some browsers)
          focusMode: { ideal: 'continuous' },
        }
      : {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
        };

    scanControls = await codeReader.decodeFromConstraints(
      { video: videoConstraints },
      videoEl,
      (result) => {
        if (result) onScanSuccess(result.getText());
      }
    );

    // Persist this camera choice
    if (cam) localStorage.setItem(CAMERA_PREF_KEY, cam.deviceId);

    const label = cam && cam.label ? cam.label.slice(0, 30) : 'CAMERA';
    setStatus(`SCANNING · ${label.toUpperCase()}`, 'ok');
    $('#stop-btn').disabled = false;
  }

  async function switchCamera() {
    if (!codeReader || backCameras.length <= 1) return;
    currentCameraIndex = (currentCameraIndex + 1) % backCameras.length;
    setStatus('SWITCHING CAMERA…');
    try {
      await startWithCurrentCamera($('#scanner-video'));
      updateCameraButton();
    } catch (e) {
      console.error('Switch camera failed:', e);
      setStatus('SWITCH FAILED', 'err');
    }
  }

  function updateCameraButton() {
    const btn = $('#switch-camera-btn');
    if (!btn) return;
    if (backCameras.length > 1 && codeReader) {
      btn.style.display = 'inline-block';
      btn.textContent = `CAM ${currentCameraIndex + 1}/${backCameras.length}`;
    } else {
      btn.style.display = 'none';
    }
  }

  async function stopScanner() {
    try {
      if (scanControls) {
        scanControls.stop();
        scanControls = null;
      }
      if (codeReader) {
        codeReader = null;
      }
      const videoEl = $('#scanner-video');
      if (videoEl && videoEl.srcObject) {
        videoEl.srcObject.getTracks().forEach(t => t.stop());
        videoEl.srcObject = null;
      }
    } catch (e) { /* ignore */ }
    setStatus('CAMERA OFF');
    $('#start-btn').disabled = false;
    $('#stop-btn').disabled = true;
    $('#switch-camera-btn').style.display = 'none';
  }

  function onScanSuccess(decoded) {
    const now = Date.now();
    if (decoded === lastScanCode && now - lastScanTime < 1500) return;
    lastScanCode = decoded;
    lastScanTime = now;

    const p = lookup(decoded);
    if (p) {
      if (navigator.vibrate) navigator.vibrate(50);
      pushRecent(p.code);
      openProduct(p.code, p.scanned);
    } else {
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
      showToast(`NOT FOUND: ${decoded}`, true);
    }
  }

  // ============== PRODUCT DETAIL ==============
  function openProduct(code, scannedRaw) {
    const p = lookup(code);
    if (!p) { showToast('PRODUCT NOT FOUND', true); return; }
    currentProductCode = code;
    renderProduct(p, scannedRaw);
    $('#product-modal').classList.add('open');
  }

  function closeProduct() {
    $('#product-modal').classList.remove('open');
    if (chart) { chart.destroy(); chart = null; }
    currentProductCode = null;
  }

  // Compute momentum metrics that properly handle partial months.
  // Returns { recentWeekly, priorWeekly, deltaPct, partialMonth, projectedMonthRevenue, daysElapsed, daysInMonth }
  function computeMomentum(sales, months) {
    const n = months.length;
    if (n < 4) return null;
    const partials = (DATA.partial_months || {});
    const lastMonth = months[n - 1];
    const isLastPartial = !!partials[lastMonth];

    // Determine effective "weeks per month" — partial months count proportionally
    const weeksFor = (mk) => {
      const p = partials[mk];
      if (p) return p.days / 7.0;
      return 4.345;
    };

    // Recent window: last full month + the partial month (if any)
    // Prior window: the 2 months before the recent window
    let recentMonths, priorMonths;
    if (isLastPartial && n >= 5) {
      // Recent = [partial, last full]; Prior = [2 before that]
      recentMonths = [months[n - 2], months[n - 1]];
      priorMonths = [months[n - 4], months[n - 3]];
    } else {
      recentMonths = [months[n - 2], months[n - 1]];
      priorMonths = [months[n - 4], months[n - 3]];
    }

    const sumAmt = (mks) => mks.reduce((s, mk) => s + (sales.ma[months.indexOf(mk)] || 0), 0);
    const sumWks = (mks) => mks.reduce((s, mk) => s + weeksFor(mk), 0);

    const recentAmt = sumAmt(recentMonths);
    const priorAmt = sumAmt(priorMonths);
    const recentWeeks = sumWks(recentMonths);
    const priorWeeks = sumWks(priorMonths);

    const recentWeekly = recentWeeks > 0 ? recentAmt / recentWeeks : 0;
    const priorWeekly = priorWeeks > 0 ? priorAmt / priorWeeks : 0;
    const deltaPct = priorWeekly > 0 ? ((recentWeekly - priorWeekly) / priorWeekly) * 100 : null;

    // Project the partial month to full-month equivalent
    let partialMonth = null;
    let projectedMonthRevenue = null;
    let daysElapsed = null;
    let daysInMonth = null;
    if (isLastPartial) {
      const p = partials[lastMonth];
      daysElapsed = p.days;
      daysInMonth = p.total;
      const partialIdx = n - 1;
      const partialAmt = sales.ma[partialIdx] || 0;
      projectedMonthRevenue = (partialAmt / daysElapsed) * daysInMonth;
      partialMonth = lastMonth;
    }

    return { recentWeekly, priorWeekly, deltaPct, partialMonth, projectedMonthRevenue, daysElapsed, daysInMonth };
  }

  function renderProduct(p, scannedRaw) {
    $('#modal-label').textContent = `CODE ${p.code}`;
    const c = $('#modal-content');
    const sales = p.sales;
    const months = DATA.months;

    // ===== Momentum (recent vs prior, with partial-month awareness) =====
    const momentum = sales ? computeMomentum(sales, months) : null;
    let trendIndicator = '';
    if (momentum && momentum.deltaPct !== null) {
      const d = momentum.deltaPct;
      const sign = d >= 0 ? '+' : '';
      const color = d >= 5 ? 'var(--good)' : (d <= -5 ? 'var(--bad)' : 'var(--text-dim)');
      trendIndicator = `<span style="color: ${color}; font-family: var(--font-display); font-size: 14px; font-weight: 700;">${sign}${d.toFixed(0)}%</span>`;
    }

    const scaleNote = (scannedRaw && scannedRaw !== p.code)
      ? `<div style="margin-bottom: 12px; padding: 8px 10px; background: var(--surface-2); border-left: 2px solid var(--accent); border-radius: 2px; font-family: var(--font-display); font-size: 10px; color: var(--text-dim);">
           SCANNED: ${escapeHtml(scannedRaw)} → MATCHED POS: ${p.code}
         </div>` : '';

    // ===== PRICE BLOCK (top) =====
    // If multipack, show the "2/$6" prominently with per-unit price as a sub
    let priceBlock = '';
    if (p.price !== null && p.price !== undefined) {
      if (p.multipack) {
        priceBlock = `
          <div class="stat accent">
            <div class="label">MULTIPACK PRICE</div>
            <div class="value">${escapeHtml(p.multipack)}</div>
            <div class="sub">${fmtMoney(p.price)} each</div>
          </div>`;
      } else {
        priceBlock = `
          <div class="stat accent">
            <div class="label">PRICE</div>
            <div class="value">${fmtMoney(p.price)}</div>
            <div class="sub">${p.depuis ? 'since ' + escapeHtml(p.depuis) : ''}</div>
          </div>`;
      }
    } else {
      priceBlock = `
        <div class="stat">
          <div class="label">PRICE</div>
          <div class="value" style="color: var(--text-faint)">—</div>
          <div class="sub">no price set</div>
        </div>`;
    }

    // ===== MARGIN BLOCK =====
    let marginBlock = '';
    if (p.marginPct !== null && p.marginPct !== undefined) {
      const m = p.marginPct;
      let marginColor = 'var(--text)';
      if (m < 0) marginColor = 'var(--bad)';
      else if (m < 15) marginColor = 'var(--warn)';
      else if (m >= 30) marginColor = 'var(--good)';
      marginBlock = `
        <div class="stat">
          <div class="label">MARGIN</div>
          <div class="value" style="color: ${marginColor}">${m.toFixed(1)}%</div>
          <div class="sub">${p.unitCost !== null ? 'cost ' + fmtMoney(p.unitCost) : ''}</div>
        </div>`;
    } else {
      marginBlock = `
        <div class="stat">
          <div class="label">MARGIN</div>
          <div class="value" style="color: var(--text-faint)">—</div>
          <div class="sub"></div>
        </div>`;
    }

    let html = `
      ${scaleNote}
      <h2 class="product-name">${escapeHtml(p.name)}</h2>
      <div class="product-meta">
        ${p.dept ? `<span>${escapeHtml(p.dept)}</span>` : ''}
        <span>${p.code}</span>
        ${sales ? `<span>${sales.na} mo. active</span>` : '<span>no sales data</span>'}
      </div>

      <div class="stat-grid">
        ${priceBlock}
        ${marginBlock}
        <div class="stat">
          <div class="label">AVG / WEEK</div>
          <div class="value">${sales ? fmtMoney(sales.wka) : '—'}</div>
          <div class="sub">${sales ? fmtQty(sales.wkq) + ' units' : 'no history'}</div>
        </div>
        <div class="stat">
          <div class="label">RECENT TREND</div>
          <div class="value" style="font-size: 18px;">${trendIndicator || '<span style="color: var(--text-faint)">—</span>'}</div>
          <div class="sub">last 2 mo. vs prior 2</div>
        </div>
      </div>

      ${renderCostBlock(p)}
    `;

    if (sales) {
      // ===== RECENT MOMENTUM PANEL — prominent, right above the chart =====
      if (momentum) {
        const r = momentum.recentWeekly;
        const pr = momentum.priorWeekly;
        const d = momentum.deltaPct;
        let deltaHtml = '';
        if (d !== null) {
          const cls = d >= 5 ? 'up' : (d <= -5 ? 'down' : 'flat');
          const sign = d >= 0 ? '+' : '';
          const arrow = d >= 5 ? '↑' : (d <= -5 ? '↓' : '→');
          deltaHtml = `<span class="mp-delta ${cls}">${arrow} ${sign}${d.toFixed(0)}%</span>`;
        }
        let forecastHtml = '';
        if (momentum.partialMonth && momentum.projectedMonthRevenue !== null) {
          const projWk = momentum.projectedMonthRevenue / 4.345;
          forecastHtml = `
            <div class="mp-forecast">
              ${monthLabel(momentum.partialMonth).toUpperCase()} so far: <b>${fmtMoney(sales.ma[months.length - 1])}</b>
              (${momentum.daysElapsed}/${momentum.daysInMonth} days)
              · Pace forecast: <b>${fmtMoney(momentum.projectedMonthRevenue)}</b>
            </div>`;
        }
        html += `
          <div class="momentum-panel">
            <div class="mp-title">RECENT MOMENTUM ${deltaHtml}</div>
            <div class="mp-row">
              <div class="mp-cell">
                <div class="mp-label">LAST 2 MO</div>
                <div class="mp-value">${fmtMoney(r)}</div>
                <div class="mp-sub">per week</div>
              </div>
              <div class="mp-cell">
                <div class="mp-label">PRIOR 2 MO</div>
                <div class="mp-value" style="color: var(--text-dim)">${fmtMoney(pr)}</div>
                <div class="mp-sub">per week</div>
              </div>
            </div>
            ${forecastHtml}
          </div>
        `;
      }

      // ===== DAILY (LAST 14 DAYS) =====
      if (sales.dq && sales.dq.length && DATA.last_14_days) {
        const days = DATA.last_14_days;
        const qSum = sales.dq.reduce((a, b) => a + b, 0);
        const aSum = sales.da.reduce((a, b) => a + b, 0);
        if (qSum > 0) {
          html += `
            <div class="section-title">
              <span>LAST 14 DAYS</span>
              <span class="hint">${fmtQty(qSum)} units · ${fmtMoney(aSum)}</span>
            </div>
            <div class="daily-grid">
              ${renderDailyGrid(sales, days)}
            </div>
          `;
        }
      }

      html += `
        <div class="section-title"><span>SALES TREND</span><span class="hint">${monthLabel(months[0])} → ${monthLabel(months[months.length-1])}</span></div>
        <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
        <div class="section-title"><span>MONTHLY BREAKDOWN</span><span class="hint">UNITS / REVENUE</span></div>
        <table class="month-table">
          <thead><tr><th>MONTH</th><th class="num">QTY</th><th class="num">REV</th><th class="num">TREND</th></tr></thead>
          <tbody>${renderMonthRows(sales, months)}</tbody>
        </table>
        <div style="margin-top: 16px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-display); font-size: 11px; color: var(--text-dim);">
          12-MO TOTAL: <span style="color: var(--accent); font-weight: 700;">${fmtMoney(sales.ta)}</span> ·
          ${fmtQty(sales.tq)} UNITS
        </div>
      `;
    } else {
      html += `<div class="empty-state">NO SALES HISTORY FOR THIS PRODUCT</div>`;
    }
    c.innerHTML = html;

    if (sales) requestAnimationFrame(() => renderChart(sales, months, momentum));
  }

  // Cost / case info block (only if we have useful data)
  function renderCostBlock(p) {
    if (p.unitCost === null && p.caseCost === null && !p.unitsPerCase) return '';
    const hasCase = p.unitsPerCase && p.unitsPerCase > 1;
    return `
      <div class="section-title"><span>COST &amp; PACKAGING</span><span class="hint">FROM PRICE LIST</span></div>
      <div class="stat-grid">
        <div class="stat">
          <div class="label">UNIT COST</div>
          <div class="value">${p.unitCost !== null ? fmtMoney(p.unitCost) : '—'}</div>
          <div class="sub">cost per unit</div>
        </div>
        ${hasCase ? `
        <div class="stat">
          <div class="label">CASE COST</div>
          <div class="value">${p.caseCost !== null ? fmtMoney(p.caseCost) : '—'}</div>
          <div class="sub">${p.unitsPerCase} units/case</div>
        </div>` : `
        <div class="stat">
          <div class="label">PACK</div>
          <div class="value">${p.unitsPerCase ? Math.round(p.unitsPerCase) : '1'}</div>
          <div class="sub">unit${p.unitsPerCase === 1 ? '' : 's'} per case</div>
        </div>`}
      </div>
    `;
  }

  function renderDailyGrid(sales, days) {
    const maxQ = Math.max(...sales.dq, 1);
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return days.map((d, i) => {
      const q = sales.dq[i] || 0;
      const a = sales.da[i] || 0;
      const heightPct = q > 0 ? Math.max(8, (q / maxQ) * 100) : 0;
      const dt = new Date(d + 'T12:00:00'); // noon to avoid TZ edge cases
      const dow = dayNames[dt.getDay()];
      const dayNum = dt.getDate();
      const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
      return `
        <div class="dg-col${isWeekend ? ' weekend' : ''}" title="${d}: ${fmtQty(q)} units, ${fmtMoney(a)}">
          <div class="dg-qty">${q > 0 ? fmtQty(q) : ''}</div>
          <div class="dg-bar-wrap">
            ${q > 0 ? `<div class="dg-bar" style="height: ${heightPct}%"></div>` : ''}
          </div>
          <div class="dg-day">${dow}</div>
          <div class="dg-date">${dayNum}</div>
        </div>
      `;
    }).join('');
  }

  function renderMonthRows(sales, months) {
    const maxAmt = Math.max(...sales.ma, 0.01);
    return months.map((m, i) => {
      const q = sales.mq[i]; const a = sales.ma[i];
      const pct = a > 0 ? (a / maxAmt * 100) : 0;
      return `<tr>
        <td>${monthLabel(m)}</td>
        <td class="num ${q === 0 ? 'zero' : ''}">${fmtQty(q)}</td>
        <td class="num amt ${a === 0 ? 'zero' : ''}">${fmtMoney(a)}</td>
        <td class="num trend">${a > 0 ? `<div class="trend-bar" style="width: ${pct}%"></div>` : '<span class="zero">—</span>'}</td>
      </tr>`;
    }).join('');
  }

  function renderChart(sales, months, momentum) {
    const ctx = document.getElementById('trend-chart');
    if (!ctx) return;
    if (chart) chart.destroy();

    const partials = DATA.partial_months || {};
    const partialIdx = months.findIndex(m => partials[m]);
    const hasPartial = partialIdx >= 0;

    // Build datasets:
    //   1) Solid line: all months EXCEPT partial (data: actual values with null in partial slot)
    //   2) Dashed line: only the connection from last-full month to partial month (showing it as incomplete)
    //   3) Projection point/segment: from partial month to its projected end-of-month value
    const labels = months.map(monthLabel);
    let projectedValue = null;
    if (hasPartial && momentum && momentum.projectedMonthRevenue !== null) {
      projectedValue = momentum.projectedMonthRevenue;
    }
    if (hasPartial) labels.push(monthLabel(months[partialIdx]) + ' (proj)');

    // Solid line: full months only (null in partial + projection slots)
    const solidData = months.map((m, i) => partials[m] ? null : sales.ma[i]);
    if (hasPartial) solidData.push(null);

    // Dashed line: partial month actual value (connects from prior to partial)
    const dashedData = months.map((m, i) => {
      if (i === partialIdx) return sales.ma[i];
      if (i === partialIdx - 1) return sales.ma[i]; // anchor to previous full month
      return null;
    });
    if (hasPartial) dashedData.push(null);

    // Projection: from partial-month-actual to projected-month-end
    const projectionData = months.map(() => null);
    if (hasPartial && projectedValue !== null) {
      projectionData[partialIdx] = sales.ma[partialIdx];
      projectionData.push(projectedValue);
    }

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Actual',
            data: solidData,
            borderColor: '#d4ff3a',
            backgroundColor: 'rgba(212, 255, 58, 0.1)',
            borderWidth: 2,
            tension: 0.25,
            fill: 'origin',
            pointBackgroundColor: '#d4ff3a',
            pointRadius: 3,
            pointHoverRadius: 5,
            spanGaps: false,
          },
          {
            label: 'Partial',
            data: dashedData,
            borderColor: '#d4ff3a',
            backgroundColor: 'rgba(212, 255, 58, 0.05)',
            borderWidth: 2,
            borderDash: [4, 4],
            tension: 0.25,
            fill: false,
            pointBackgroundColor: '#d4ff3a',
            pointBorderColor: '#0a0a0a',
            pointBorderWidth: 2,
            pointRadius: 3,
            pointStyle: 'rect',
            spanGaps: false,
          },
          {
            label: 'Projected',
            data: projectionData,
            borderColor: '#8aa825',
            backgroundColor: 'rgba(138, 168, 37, 0.06)',
            borderWidth: 1.5,
            borderDash: [2, 4],
            tension: 0,
            fill: false,
            pointBackgroundColor: 'rgba(138, 168, 37, 0.8)',
            pointBorderColor: '#0a0a0a',
            pointBorderWidth: 1,
            pointRadius: 4,
            pointStyle: 'triangle',
            spanGaps: false,
          },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1c1c1c', borderColor: '#2a2a2a', borderWidth: 1,
            titleColor: '#f4f4f4', bodyColor: '#d4ff3a',
            titleFont: { family: 'ui-monospace, monospace', size: 10 },
            bodyFont: { family: 'ui-monospace, monospace', size: 12, weight: 'bold' },
            padding: 8, displayColors: false,
            filter: (item) => item.parsed.y !== null,
            callbacks: {
              label: (ctx) => {
                const i = ctx.dataIndex;
                if (i >= months.length) {
                  // Projection point
                  return `Forecast: $${Math.round(projectedValue).toLocaleString()}`;
                }
                const m = months[i];
                const partialNote = partials[m] ? ` (${partials[m].days}/${partials[m].total} days)` : '';
                return `$${Math.round(sales.ma[i]).toLocaleString()} / ${fmtQty(sales.mq[i])} units${partialNote}`;
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#666', font: { family: 'ui-monospace, monospace', size: 9 } } },
          y: {
            grid: { color: '#1c1c1c' },
            ticks: { color: '#666', font: { family: 'ui-monospace, monospace', size: 9 },
              callback: (v) => '$' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v) },
            beginAtZero: true,
          }
        }
      }
    });
  }

  // ============== SEARCH ==============
  let searchTimer = null;
  function doSearch(q) {
    const results = $('#search-results');
    q = q.trim().toLowerCase();
    if (q.length < 2) { results.innerHTML = '<div class="empty-state">TYPE TO SEARCH PRODUCTS</div>'; return; }

    const matches = [];
    const isNum = /^\d+$/.test(q);
    const limit = 50;

    for (const code in DATA.products) {
      const [name, price] = DATA.products[resolveCode(code)] || [];
      let matchScore = 0;
      if (isNum && code.includes(q)) {
        matchScore = 100 + (code === q ? 50 : 0);
      } else {
        const lname = name.toLowerCase();
        if (lname.startsWith(q)) matchScore = 50;
        else if (lname.includes(q)) matchScore = 25;
      }
      if (matchScore > 0) {
        const sales = DATA.sales[code];
        matches.push({ code, name, price, matchScore, rev: sales ? sales.ta : 0 });
      }
      if (matches.length > 500) break;
    }

    matches.sort((a, b) => (b.matchScore - a.matchScore) || (b.rev - a.rev));
    const top = matches.slice(0, limit);
    if (top.length === 0) { results.innerHTML = '<div class="empty-state">NO MATCHES</div>'; return; }

    results.innerHTML = top.map(m => `
      <div class="search-row" data-code="${m.code}">
        <div style="flex: 1; min-width: 0;">
          <div class="name">${escapeHtml(m.name)}</div>
          <div class="code">${m.code}${m.rev > 0 ? ' · $' + Math.round(m.rev).toLocaleString() + '/yr' : ''}</div>
        </div>
        <div class="price">${m.price !== null ? fmtMoney(m.price) : '—'}</div>
      </div>
    `).join('');

    results.querySelectorAll('.search-row').forEach(row => {
      row.addEventListener('click', () => openProduct(row.dataset.code));
    });
  }

  // ============== LISTS ==============
  function getLists() {
    try { return JSON.parse(localStorage.getItem(LISTS_KEY) || '[]'); }
    catch { return []; }
  }

  // ── Shared auto label-batches (from data.json, visible to all users) ──
  const BATCH_DONE_KEY = 'decarie_batch_done_v1';
  function getBatchDone() { try { return JSON.parse(localStorage.getItem(BATCH_DONE_KEY) || '[]'); } catch { return []; } }
  function batchIsDone(id) { return getBatchDone().includes(id); }
  function toggleBatchDone(id) {
    const s = getBatchDone();
    const i = s.indexOf(id);
    if (i >= 0) s.splice(i, 1); else s.push(id);
    localStorage.setItem(BATCH_DONE_KEY, JSON.stringify(s));
  }
  function getBatches() { return (DATA.batches || []).slice().sort((a,b)=> a.date < b.date ? 1 : -1); }
  // Resolve a card id to either a personal list or a shared batch (read-only).
  function findListLike(id) {
    if (typeof id === 'string' && id[0] === 'B') {
      const b = getBatches().find(x => x.id === id);
      if (b) return { id: b.id, name: b.title, items: (b.items || []).slice(), _readonly: true, _batch: b };
    }
    return getLists().find(l => l.id === id);
  }
  function saveLists(lists) {
    localStorage.setItem(LISTS_KEY, JSON.stringify(lists));
  }
  function createList(name) {
    const lists = getLists();
    const id = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    lists.unshift({ id, name: name.trim(), items: [], created: Date.now() });
    saveLists(lists);
    return id;
  }
  function deleteList(id) {
    saveLists(getLists().filter(l => l.id !== id));
  }
  function renameList(id, newName) {
    const lists = getLists();
    const list = lists.find(l => l.id === id);
    if (list) { list.name = newName.trim(); saveLists(lists); }
  }
  function addToList(listId, code) {
    const lists = getLists();
    const list = lists.find(l => l.id === listId);
    if (!list) return false;
    if (list.items.includes(code)) return false;
    list.items.push(code);
    saveLists(lists);
    return true;
  }
  function removeFromList(listId, code) {
    const lists = getLists();
    const list = lists.find(l => l.id === listId);
    if (!list) return;
    list.items = list.items.filter(c => c !== code);
    saveLists(lists);
  }

  function renderLists() {
    const container = $('#lists-container');
    const lists = getLists();
    const batches = getBatches();

    // ── Shared auto-batches (new / price-changed items) ──
    let batchHtml = '';
    if (batches.length) {
      const cards = batches.map(b => {
        const count = (b.items || []).length;
        const done = batchIsDone(b.id);
        return `
        <div class="list-card batch-card ${done ? 'batch-done' : ''}" data-id="${b.id}">
          <div style="flex: 1; min-width: 0;">
            <div class="ltitle">${escapeHtml(b.title)} <span class="batch-badge">${done ? '✓ FAIT' : 'AUTO'}</span></div>
            <div class="lmeta">${b.n_new||0} nouveau${(b.n_new||0)===1?'':'x'} · ${b.n_changed||0} prix · ${count} article${count===1?'':'s'}</div>
          </div>
          <div class="larrow">›</div>
        </div>`;
      }).join('');
      batchHtml = `<div class="batch-section-label">ÉTIQUETTES À IMPRIMER · AUTO</div>${cards}
        <div class="batch-hint">Listes automatiques des produits nouveaux ou dont le prix a changé. Effacées après 14 jours.</div>`;
    }

    // ── Personal lists ──
    let listHtml;
    if (lists.length === 0) {
      listHtml = '<div class="empty-state">NO LISTS YET — CREATE ONE ABOVE</div>';
    } else {
      listHtml = lists.map(l => {
        const count = l.items.length;
        let total = 0;
        for (const code of l.items) {
          const p = DATA.products[resolveCode(code)];
          if (p && p[1] !== null) total += p[1];
        }
        return `
          <div class="list-card" data-id="${l.id}">
            <div style="flex: 1; min-width: 0;">
              <div class="ltitle">${escapeHtml(l.name)}</div>
              <div class="lmeta">${count} ITEM${count === 1 ? '' : 'S'} · TOTAL ${fmtMoney(total)}</div>
            </div>
            <div class="larrow">›</div>
          </div>
        `;
      }).join('');
    }

    container.innerHTML = batchHtml + (batches.length ? '<div class="batch-section-label">MES LISTES</div>' : '') + listHtml;

    container.querySelectorAll('.list-card').forEach(card => {
      card.addEventListener('click', () => openListDetail(card.dataset.id));
    });
  }

  function openListDetail(listId) {
    currentListId = listId;
    const list = findListLike(listId);
    if (!list) return;
    renderListDetail(list);
    $('#list-detail-modal').classList.add('open');
  }

  function closeListDetail() {
    $('#list-detail-modal').classList.remove('open');
    currentListId = null;
  }

  function renderListDetail(list) {
    $('#list-detail-label').textContent = list.name.toUpperCase().slice(0, 30);
    const c = $('#list-detail-content');
    let total = 0;
    const items = list.items.map(code => {
      const p = DATA.products[resolveCode(code)];
      if (!p) return null;
      const [name, price, deptCode, marginPct, unitCost, caseCost, unitsPerCase, multipack] = p;
      if (price !== null && price !== undefined) total += price;
      const dept = (deptCode != null && DATA.depts) ? DATA.depts[String(deptCode)] : null;
      return { code, name, price, dept, multipack };
    }).filter(Boolean);

    const ro = !!list._readonly;
    let html = `
      <div class="list-detail-actions">
        ${ro ? '' : '<button class="btn small" id="rename-list-btn">RENAME</button>'}
        ${ro ? '' : '<button class="btn small" id="print-list-btn">PRINT LIST</button>'}
        <button class="btn small" id="print-labels-btn">${ro ? 'IMPRIMER ÉTIQUETTES' : 'PRINT LABELS'}</button>
        ${ro ? `<button class="btn small" id="batch-done-btn">${batchIsDone(list.id) ? 'ANNULER ✓' : '✓ FAIT'}</button>`
              : '<button class="btn small danger" id="delete-list-btn">DELETE LIST</button>'}
      </div>
      <div style="margin-bottom: 14px; font-family: var(--font-display); font-size: 11px; color: var(--text-dim);">
        ${items.length} ITEM${items.length === 1 ? '' : 'S'} · TOTAL ${fmtMoney(total)}
      </div>
    `;

    if (items.length === 0) {
      html += `<div class="empty-state">EMPTY LIST<br><br>SCAN OR SEARCH A PRODUCT,<br>THEN TAP "+ LIST" TO ADD</div>`;
    } else {
      html += items.map(item => {
        const barcodeOk = isPrintableBarcode(item.code);
        const metaBits = [item.code];
        if (item.dept) metaBits.push(item.dept);
        const priceDisplay = item.price !== null && item.price !== undefined
          ? (item.multipack ? `<div class="li-price">${escapeHtml(item.multipack)}</div><div class="li-price-sub">${fmtMoney(item.price)} EA</div>` : `<div class="li-price">${fmtMoney(item.price)}</div>`)
          : '<div class="li-price">—</div>';
        return `
          <div class="list-item">
            <div class="li-row1">
              <div style="flex: 1; min-width: 0;">
                <div class="li-name">${escapeHtml(item.name)}</div>
                <div class="li-meta">${escapeHtml(metaBits.join(' · '))}</div>
              </div>
              <div style="text-align: right;">${priceDisplay}</div>
            </div>
            ${barcodeOk
              ? `<div class="li-barcode"><svg class="bc-svg" data-code="${item.code}"></svg></div>`
              : `<div class="li-no-barcode">CODE NOT SCANNABLE (${item.code.length} DIGITS)</div>`}
            <div class="li-actions">
              <button class="btn small" data-action="view" data-code="${item.code}">VIEW</button>
              ${ro ? '' : `<button class="btn small danger" data-action="remove" data-code="${item.code}">REMOVE</button>`}
            </div>
          </div>
        `;
      }).join('');
    }
    c.innerHTML = html;

    // Render barcodes — defer to after the modal is visible & laid out,
    // because JsBarcode needs the SVG element to have real layout dimensions.
    requestAnimationFrame(() => {
      c.querySelectorAll('.bc-svg').forEach(svg => {
        const ok = renderBarcode(svg, svg.dataset.code);
        if (!ok) {
          // Replace the failed SVG with a fallback message
          const parent = svg.closest('.li-barcode');
          if (parent) {
            parent.outerHTML = `<div class="li-no-barcode">BARCODE RENDER FAILED — CODE: ${escapeHtml(svg.dataset.code)}</div>`;
          }
        }
      });
    });

    // Bind action buttons

    });
  }

  // Check digit calculations to reconstruct the ORIGINAL printed barcode
  // from POS-stored codes (which have the check digit stripped).
  function upcACheckDigit(code11) {
    // UPC-A: positions 1,3,5,7,9,11 weight 3; positions 2,4,6,8,10 weight 1
    let sum = 0;
    for (let i = 0; i < 11; i++) {
      sum += parseInt(code11[i], 10) * (i % 2 === 0 ? 3 : 1);
    }
    return (10 - (sum % 10)) % 10;
  }
  function ean13CheckDigit(code12) {
    // EAN-13: positions 1,3,5,7,9,11 weight 1; positions 2,4,6,8,10,12 weight 3
    let sum = 0;
    for (let i = 0; i < 12; i++) {
      sum += parseInt(code12[i], 10) * (i % 2 === 0 ? 1 : 3);
    }
    return (10 - (sum % 10)) % 10;
  }

  function isPrintableBarcode(code) {
    return /^\d+$/.test(code) && code.length >= 4;
  }

  // Render the ORIGINAL printed barcode as it appears on the package.
  // POS strips the check digit; we add it back so the rendered barcode
  // matches what's printed on the actual product.
  //   11 digits → UPC-A (add UPC-A check digit, render as 12-digit UPC-A)
  //   12 digits → EAN-13 (add EAN-13 check digit, render as 13-digit EAN-13)
  //   13 digits → already a full EAN-13, render as-is
  //   8 digits → EAN-8, render as-is
  //   Scale codes (start with '2', mostly zeros after) → these are internal store
  //     codes printed by the in-store scale, NOT on manufacturer packages.
  //     Render as CODE128 so POS handheld reads the bare digits.
  //   Other lengths → CODE128 (forced mode B to avoid JsBarcode CODE128-C bugs)
  function renderBarcode(svg, code) {
    if (!window.JsBarcode) {
      console.warn('JsBarcode not loaded');
      return false;
    }
    // Detect scale-format codes: starts with '2', and the "weight/price" portion
    // (positions 6+) is all zeros — meaning it's an in-store code, not a real UPC.
    const isScaleCode = /^2\d{10,12}$/.test(code) && /^2\d{5}0+$/.test(code);

    let format = 'CODE128B';
    let value = code;

    if (!isScaleCode) {
      if (/^\d{11}$/.test(code)) {
        // 11-digit POS code → reconstruct UPC-A
        value = code + upcACheckDigit(code).toString();
        format = 'UPC';
      } else if (/^\d{12}$/.test(code)) {
        // 12-digit POS code → reconstruct EAN-13
        value = code + ean13CheckDigit(code).toString();
        format = 'EAN13';
      } else if (/^\d{13}$/.test(code)) {
        // Already full EAN-13
        value = code;
        format = 'EAN13';
      } else if (/^\d{8}$/.test(code)) {
        value = code;
        format = 'EAN8';
      }
    }

    try {
      JsBarcode(svg, value, {
        format: format,
        width: 1.8,
        height: 55,
        displayValue: true,
        fontSize: 13,
        textMargin: 2,
        margin: 6,
        background: '#ffffff',
        lineColor: '#000000',
        flat: true,  // No supplemental/EAN-2/EAN-5 add-on parsing
      });
      return true;
    } catch (e) {
      console.warn('Primary format failed for', code, 'as', format, '— falling back to CODE128B:', e.message);
      // Fallback: render as CODE128B with the bare POS code
      try {
        JsBarcode(svg, code, {
          format: 'CODE128B',
          width: 1.8,
          height: 55,
          displayValue: true,
          fontSize: 13,
          textMargin: 2,
          margin: 6,
          background: '#ffffff',
          lineColor: '#000000',
        });
        return true;
      } catch (e2) {
        console.error('All barcode formats failed for', code, e2);
        return false;
      }
    }
  }

  // ============== TABS ==============
  function switchTab(name) {
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    $('#scanner-view').classList.toggle('active', name === 'scanner');
    $('#search-view').classList.toggle('active', name === 'search');
    $('#lists-view').classList.toggle('active', name === 'lists');
    $('#count-view').classList.toggle('active', name === 'count');
    if (name !== 'scanner' && codeReader) stopScanner();
    if (name !== 'count' && countCodeReader) stopCountScanner();
    if (name === 'search') setTimeout(() => $('#search-input').focus(), 50);
    if (name === 'lists') renderLists();
    if (name === 'count') openCountView();
  }

  // ============== COUNT SYSTEM ==============
  // Independent scanner instance for the count view, so it doesn't fight with the
  // main scanner tab's lifecycle.
  let countCodeReader = null;
  let countScanControls = null;
  let countLastCode = null;
  let countLastTime = 0;
  let currentCountId = null;
  let countQtyPadOpen = false;
  let countPendingCode = null;
  const COUNTS_KEY = 'decarie_counts_v1';
  const ACTIVE_COUNT_KEY = 'decarie_active_count_v1';

  function getCountSessions() {
    try { return JSON.parse(localStorage.getItem(COUNTS_KEY) || '[]'); }
    catch { return []; }
  }
  function saveCountSessions(arr) {
    localStorage.setItem(COUNTS_KEY, JSON.stringify(arr));
  }
  function createCountSession(name) {
    const sessions = getCountSessions();
    const id = 'C' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    sessions.unshift({
      id,
      name: name.trim(),
      items: {}, // { code: qty }
      created: Date.now(),
      updated: Date.now(),
    });
    saveCountSessions(sessions);
    return id;
  }
  function getCountSession(id) {
    return getCountSessions().find(s => s.id === id) || null;
  }
  function updateCountSession(id, mutator) {
    const sessions = getCountSessions();
    const idx = sessions.findIndex(s => s.id === id);
    if (idx < 0) return null;
    mutator(sessions[idx]);
    sessions[idx].updated = Date.now();
    saveCountSessions(sessions);
    return sessions[idx];
  }
  function deleteCountSession(id) {
    saveCountSessions(getCountSessions().filter(s => s.id !== id));
  }

  function setQty(code, qty) {
    if (!currentCountId) return;
    updateCountSession(currentCountId, (s) => {
      if (qty <= 0) {
        delete s.items[code];
      } else {
        s.items[code] = qty;
      }
    });
    renderActiveCount();
  }
  function bumpQty(code, delta) {
    const s = getCountSession(currentCountId);
    if (!s) return;
    const current = s.items[code] || 0;
    setQty(code, current + delta);
  }

  function openCountView() {
    // Decide: start UI or active session UI
    const activeId = localStorage.getItem(ACTIVE_COUNT_KEY);
    if (activeId && getCountSession(activeId)) {
      currentCountId = activeId;
      $('#count-start').style.display = 'none';
      $('#count-active').style.display = 'block';
      renderActiveCount();
      // Auto-start camera after a beat
      setTimeout(() => startCountScanner(), 200);
    } else {
      currentCountId = null;
      $('#count-active').style.display = 'none';
      $('#count-start').style.display = 'block';
      renderCountSessionsList();
    }
  }

  function renderCountSessionsList() {
    const container = $('#count-sessions-list');
    const sessions = getCountSessions();
    $('#count-sessions-hint').textContent = sessions.length ? `${sessions.length} TOTAL` : '';
    if (sessions.length === 0) {
      container.innerHTML = '<div class="empty-state">NO PREVIOUS COUNTS</div>';
      return;
    }
    container.innerHTML = sessions.map(s => {
      const skuCount = Object.keys(s.items).length;
      const totalUnits = Object.values(s.items).reduce((a, b) => a + b, 0);
      const date = new Date(s.created).toLocaleDateString();
      return `
        <div class="count-session-card" data-id="${s.id}">
          <div>
            <div class="csc-name">${escapeHtml(s.name)}</div>
            <div class="csc-meta">${date} · ${skuCount} SKU${skuCount === 1 ? '' : 'S'} · ${totalUnits} UNITS</div>
          </div>
          <div class="larrow">›</div>
        </div>
      `;
    }).join('');
    container.querySelectorAll('[data-id]').forEach(card => {
      card.addEventListener('click', () => openCountSessionDetail(card.dataset.id));
    });
  }

  function renderActiveCount() {
    const s = getCountSession(currentCountId);
    if (!s) return;
    $('#count-session-name').textContent = s.name;

    const entries = Object.entries(s.items);
    const skuCount = entries.length;
    const totalUnits = entries.reduce((a, [, q]) => a + q, 0);
    let totalValue = 0;
    for (const [code, qty] of entries) {
      const p = DATA.products[resolveCode(code)];
      if (p && p[1] != null) totalValue += p[1] * qty;
    }

    $('#count-skus').textContent = skuCount;
    $('#count-skus-plural').textContent = skuCount === 1 ? '' : 'S';
    $('#count-units').textContent = totalUnits;
    $('#count-value').textContent = fmtMoney(totalValue);
    $('#count-list-hint').textContent = skuCount > 0 ? `MOST RECENT FIRST` : '';

    // Render counted items list (most recent first)
    const itemsList = $('#count-items-list');
    if (entries.length === 0) {
      itemsList.innerHTML = '<div class="empty-state">NO ITEMS COUNTED YET<br><br>SCAN A BARCODE TO BEGIN</div>';
      return;
    }
    // Sort by insertion order (latest first)
    const ordered = entries.slice().reverse();
    itemsList.innerHTML = ordered.map(([code, qty]) => {
      const p = DATA.products[resolveCode(code)];
      const name = p ? p[0] : `(unknown code ${code})`;
      const price = p ? p[1] : null;
      const subtotal = price != null ? `${fmtMoney(price * qty)}` : '';
      return `
        <div class="counted-item" data-code="${code}">
          <div class="ci-info">
            <div class="ci-name">${escapeHtml(name)}</div>
            <div class="ci-meta">${code}${subtotal ? ' · ' + subtotal : ''}</div>
          </div>
          <div class="ci-qty">${qty}</div>
          <span class="ci-del-hint">CONFIRM?</span>
          <div class="ci-actions">
            <button class="ci-btn ci-dec" data-act="dec" data-code="${code}" aria-label="decrease">−</button>
            <button class="ci-btn ci-inc" data-act="inc" data-code="${code}" aria-label="increase">+</button>
            <button class="ci-btn ci-del" data-act="del" data-code="${code}" aria-label="delete">×</button>
          </div>
        </div>
      `;
    }).join('');

    itemsList.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const code = btn.dataset.code;
        const act = btn.dataset.act;
        const row = btn.closest('.counted-item');
        if (act === 'inc') {
          // Clear any pending delete-confirm on this row
          row.classList.remove('confirm-delete');
          bumpQty(code, 1);
        } else if (act === 'dec') {
          row.classList.remove('confirm-delete');
          const s = getCountSession(currentCountId);
          const current = (s?.items[code]) || 0;
          if (current <= 1) {
            // Going to zero — armed for explicit delete via × instead
            if (current === 1) {
              showToast('TAP × TO DELETE', true);
              return;
            }
            return;
          }
          bumpQty(code, -1);
        } else if (act === 'del') {
          // Two-tap delete pattern
          if (row.classList.contains('confirm-delete')) {
            setQty(code, 0);
          } else {
            // Arm this row, disarm any other
            itemsList.querySelectorAll('.counted-item.confirm-delete').forEach(r => r.classList.remove('confirm-delete'));
            row.classList.add('confirm-delete');
            // Auto-disarm after 3 seconds
            setTimeout(() => row.classList.remove('confirm-delete'), 3000);
          }
        }
      });
    });
  }

  // -------- Count scanner --------
  async function startCountScanner() {
    if (countCodeReader) return;
    if (!window.ZXingBrowser) {
      countBanner('SCANNER FAILED TO LOAD', 'err');
      return;
    }
    try {
      const videoEl = $('#count-video');
      countCodeReader = new ZXingBrowser.BrowserMultiFormatReader();

      // Reuse the same back-camera selection logic as the main scanner
      if (backCameras.length === 0) backCameras = await enumerateCameras();
      const savedId = localStorage.getItem(CAMERA_PREF_KEY);
      let cam = null;
      if (savedId) cam = backCameras.find(d => d.deviceId === savedId);
      if (!cam) cam = backCameras[0];

      const videoConstraints = cam ? {
        deviceId: { exact: cam.deviceId },
        width: { ideal: 1920 }, height: { ideal: 1080 },
        focusMode: { ideal: 'continuous' },
      } : { facingMode: { ideal: 'environment' } };

      countScanControls = await countCodeReader.decodeFromConstraints(
        { video: videoConstraints },
        videoEl,
        (result) => { if (result) onCountScanSuccess(result.getText()); }
      );
      countBanner('READY · SCAN ITEM', 'ok', 1200);
    } catch (e) {
      console.error('Count scanner start error:', e);
      countBanner('CAMERA ERROR — ' + (e.name || ''), 'err');
      countCodeReader = null;
      countScanControls = null;
    }
  }

  async function stopCountScanner() {
    try {
      if (countScanControls) { countScanControls.stop(); countScanControls = null; }
      countCodeReader = null;
      const v = $('#count-video');
      if (v && v.srcObject) {
        v.srcObject.getTracks().forEach(t => t.stop());
        v.srcObject = null;
      }
    } catch (e) {}
  }

  let countBannerTimer = null;
  function countBanner(text, kind, autoClear) {
    const el = $('#count-banner');
    if (!el) return;
    el.textContent = text;
    el.className = 'count-scanner-banner show' + (kind ? ' ' + kind : '');
    clearTimeout(countBannerTimer);
    if (autoClear) {
      countBannerTimer = setTimeout(() => el.classList.remove('show'), autoClear);
    }
  }

  function onCountScanSuccess(decoded) {
    // Ignore scans while qty pad is open
    if (countQtyPadOpen) return;
    const now = Date.now();
    if (decoded === countLastCode && now - countLastTime < 1500) return;
    countLastCode = decoded;
    countLastTime = now;

    const p = lookup(decoded);
    if (!p) {
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
      countBanner(`NOT FOUND: ${decoded}`, 'err', 1500);
      return;
    }
    if (navigator.vibrate) navigator.vibrate(40);
    openQtyPad(p.code);
  }

  // qpBuffer holds the digits typed on the numpad. Empty means "no input yet"
  // — we show the default (existing qty or 1) until user starts typing.
  let qpBuffer = '';
  let qpDefault = 1;

  function updateQpDisplay() {
    const v = qpBuffer === '' ? String(qpDefault) : qpBuffer;
    $('#qp-display').textContent = v;
  }

  function openQtyPad(code) {
    countPendingCode = code;
    countQtyPadOpen = true;
    const p = lookup(code);
    const existing = (getCountSession(currentCountId)?.items || {})[code] || 0;

    $('#qp-product-name').textContent = p.name;
    const metaBits = [code];
    if (p.dept) metaBits.push(p.dept);
    if (p.price != null) metaBits.push(fmtMoney(p.price));
    $('#qp-product-meta').textContent = metaBits.join(' · ');

    // Default to existing qty if any, otherwise 1
    qpDefault = existing > 0 ? existing : 1;
    qpBuffer = '';
    updateQpDisplay();

    const warn = $('#qp-existing-warning');
    if (existing > 0) {
      warn.textContent = `ALREADY COUNTED: ${existing} — CONFIRM REPLACES`;
      warn.style.display = 'block';
    } else {
      warn.style.display = 'none';
    }

    $('#count-qty-pad').classList.add('show');
    countBanner('PAUSED · ENTER QTY', '', 0);
  }

  function closeQtyPad() {
    $('#count-qty-pad').classList.remove('show');
    countQtyPadOpen = false;
    countPendingCode = null;
    qpBuffer = '';
    countBanner('READY · SCAN NEXT', 'ok', 800);
  }

  function confirmQtyPad() {
    if (!countPendingCode) { closeQtyPad(); return; }
    const raw = qpBuffer === '' ? String(qpDefault) : qpBuffer;
    const v = parseInt(raw, 10);
    if (isNaN(v) || v < 0) { showToast('INVALID QTY', true); return; }
    setQty(countPendingCode, v);
    showToast(`COUNTED ${v}`);
    closeQtyPad();
  }

  function qpKeyPress(key) {
    if (key === 'clear') {
      qpBuffer = '';
    } else if (key === 'back') {
      qpBuffer = qpBuffer.slice(0, -1);
    } else {
      // Digit
      // Prevent inputs longer than 5 digits (99,999 is plenty)
      if (qpBuffer.length >= 5) return;
      qpBuffer += key;
    }
    updateQpDisplay();
  }

  // -------- Past session detail --------
  function openCountSessionDetail(id) {
    const s = getCountSession(id);
    if (!s) return;
    const entries = Object.entries(s.items);
    const skuCount = entries.length;
    const totalUnits = entries.reduce((a, [, q]) => a + q, 0);
    let totalValue = 0;
    for (const [code, qty] of entries) {
      const p = DATA.products[resolveCode(code)];
      if (p && p[1] != null) totalValue += p[1] * qty;
    }
    const isActive = id === localStorage.getItem(ACTIVE_COUNT_KEY);

    $('#csd-label').textContent = s.name.toUpperCase().slice(0, 30);
    const c = $('#csd-content');
    const date = new Date(s.created).toLocaleString();
    let html = `
      <div style="margin-top: 14px; margin-bottom: 14px;">
        <div style="font-family: var(--font-display); font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em;">
          STARTED ${date} · ${skuCount} SKU${skuCount === 1 ? '' : 'S'} · ${totalUnits} UNITS · ${fmtMoney(totalValue)}
        </div>
      </div>
      <div class="list-detail-actions">
        ${isActive
          ? '<button class="btn small" id="csd-resume-btn">RESUME</button>'
          : '<button class="btn small" id="csd-make-active-btn">MAKE ACTIVE</button>'}
        <button class="btn small" id="csd-export-btn">EXPORT CSV</button>
        <button class="btn small danger" id="csd-delete-btn">DELETE</button>
      </div>
    `;
    if (entries.length === 0) {
      html += '<div class="empty-state">NO ITEMS COUNTED</div>';
    } else {
      html += entries.map(([code, qty]) => {
        const p = DATA.products[resolveCode(code)];
        const name = p ? p[0] : `(unknown ${code})`;
        const price = p ? p[1] : null;
        return `
          <div class="counted-item">
            <div class="ci-info">
              <div class="ci-name">${escapeHtml(name)}</div>
              <div class="ci-meta">${code}${price != null ? ' · ' + fmtMoney(price * qty) : ''}</div>
            </div>
            <div class="ci-qty">${qty}</div>
          </div>
        `;
      }).join('');
    }
    c.innerHTML = html;

    $('#csd-resume-btn')?.addEventListener('click', () => {
      $('#count-session-detail-modal').classList.remove('open');
      openCountView();
    });
    $('#csd-make-active-btn')?.addEventListener('click', () => {
      localStorage.setItem(ACTIVE_COUNT_KEY, id);
      $('#count-session-detail-modal').classList.remove('open');
      openCountView();
    });
    $('#csd-export-btn')?.addEventListener('click', () => exportCountCsv(s));
    $('#csd-delete-btn')?.addEventListener('click', () => {
      if (!confirm(`Delete count "${s.name}"?`)) return;
      deleteCountSession(id);
      if (localStorage.getItem(ACTIVE_COUNT_KEY) === id) {
        localStorage.removeItem(ACTIVE_COUNT_KEY);
      }
      $('#count-session-detail-modal').classList.remove('open');
      openCountView();
    });

    $('#count-session-detail-modal').classList.add('open');
  }

  function exportCountCsv(session) {
    const rows = [['code', 'name', 'qty', 'unit_price', 'subtotal', 'dept', 'unit_cost']];
    for (const [code, qty] of Object.entries(session.items)) {
      const p = DATA.products[resolveCode(code)];
      if (p) {
        const [name, price, deptCode, , unitCost] = p;
        const dept = (deptCode != null && DATA.depts) ? DATA.depts[String(deptCode)] : '';
        const subtotal = price != null ? (price * qty).toFixed(2) : '';
        rows.push([code, name, qty, price ?? '', subtotal, dept, unitCost ?? '']);
      } else {
        rows.push([code, '(unknown)', qty, '', '', '', '']);
      }
    }
    const csv = rows.map(r => r.map(cell => {
      const s = String(cell ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\n');
    const safe = session.name.replace(/[^a-z0-9-]+/gi, '_').slice(0, 30);
    const fname = `count_${safe}_${new Date(session.created).toISOString().slice(0, 10)}.csv`;
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
    showToast('CSV EXPORTED');
  }

  // ============== LABEL PRINTING ==============
  // Quebec-compliant shelf labels (OPC rules):
  //  - size between 9.67 cm² and 12.9 cm² → we use ~5.0cm × 2.5cm = 12.5 cm²
  //  - product description in French
  //  - all-inclusive total price
  //  - price per unit of measure for food ($/100g, $/100ml, $/kg, etc.)
  //  - plus a scannable barcode (our addition, for re-scanning at POS)

  // Extract net quantity from a product name, return {value, unit} or null.
  // Handles formats: "340G", "750ML", "1000ML", "2KG", "1.5L", "250 g", "2LT", "500GR" etc.
  // Parse net size out of a product name. Returns {value, unit} or null.
  // Handles:
  //   - Single size: "BORSEC 750ML"        → 750 ml
  //   - Multipack:   "4X473ML"             → 1892 ml (4 × 473)
  //   - Multipack:   "6 x 355 ml"          → 2130 ml
  //   - Multipack:   "PACK DE 12 X 355ML"  → 4260 ml
  // The multipack regex is tried FIRST so "4X473ML" doesn't fall through to single-size
  // and produce a per-unit price (which would dramatically understate the value).
  // Build the name shown on a label. If the product name has no size in it
  // but we have a size string (from POS F22 / Open Food Facts), append it so
  // the size is always visible in the title (e.g. "BORSEC" -> "BORSEC 750ML").
  function labelDisplayName(item) {
    let name = (item.name || '').trim();
    if (!name) return '';
    if (!parseSize(name) && item.sizeStr) {
      const s = parseSize(item.sizeStr);
      if (s) name = name + ' ' + item.sizeStr.trim();
    }
    return name;
  }

  function parseSize(name) {
    if (!name) return null;

    const normalizeUnit = (u) => {
      u = u.toLowerCase();
      if (u === 'gr') return 'g';
      if (u === 'lt') return 'l';
      return u;
    };

    // 1) Multipack pattern: N x M UNIT  (with optional spaces around the x/X)
    //    Examples that match: "4X473ML", "4 x 473ml", "6X355ML", "PACK DE 12 X 355ML"
    const mpRe = /(\d{1,3})\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*(kg|gr|mg|ml|lt|cl|g|l)\b/i;
    const mp = mpRe.exec(name);
    if (mp) {
      const count = parseInt(mp[1], 10);
      const each = parseFloat(mp[2].replace(',', '.'));
      if (count > 0 && count <= 144 && each > 0) {  // sanity bounds (cases of 144 is max realistic)
        return { value: count * each, unit: normalizeUnit(mp[3]), source: 'multipack' };
      }
    }

    // 2) Single-size fallback: last match of "<number><unit>" in the name
    const re = /(\d+(?:[.,]\d+)?)\s*(kg|gr|mg|ml|lt|cl|g|l)\b/gi;
    let m, last = null;
    while ((m = re.exec(name)) !== null) last = m;
    if (!last) return null;
    return { value: parseFloat(last[1].replace(',', '.')), unit: normalizeUnit(last[2]), source: 'single' };
  }

  // Compute unit price string per Quebec norms.
  // For solids → $/100g (or $/kg if large). For liquids → $/100ml (or $/L).
  // Returns '' when the math would produce something nonsensical
  // (price ≤ 0, size value ≤ 0, OR computed per-unit > price itself which would mean
  //  size parsed incorrectly).
  function unitPriceString(price, size) {
    if (!price || price <= 0 || !size) return '';
    const { value, unit } = size;
    if (!value || value <= 0) return '';

    let grams = null, ml = null;
    if (unit === 'kg') grams = value * 1000;
    else if (unit === 'g') grams = value;
    else if (unit === 'mg') grams = value / 1000;
    else if (unit === 'l') ml = value * 1000;
    else if (unit === 'cl') ml = value * 10;
    else if (unit === 'ml') ml = value;

    if (grams && grams > 0) {
      const per100 = price / grams * 100;
      // Sanity: per-100g shouldn't exceed the product price itself for any normal product
      if (per100 > price * 2) return '';
      return `${fmtUnit(per100)}/100g`;
    }
    if (ml && ml > 0) {
      const per100 = price / ml * 100;
      if (per100 > price * 2) return '';
      return `${fmtUnit(per100)}/100ml`;
    }
    return '';
  }
  // Format a unit price: use ¢ when under $1 (one decimal, matching POS), else $ with 2 decimals
  function fmtUnit(v) {
    if (v < 1) return `${(v * 100).toFixed(1)}¢`;
    return `$${v.toFixed(2)}`;
  }

  function printLabels(list) {
    const items = list.items.map(code => {
      const p = DATA.products[resolveCode(code)];
      if (!p) return null;
      // Schema: [name, price, dept_code, margin, unit_cost, case_cost, units_per_case, multipack, depuis, taxed, size_str]
      const [name, price, deptCode, , , , , multipack, , taxed, sizeStr] = p;
      // Defensive: skip items with missing essentials
      if (!name) return null;
      // Sanitize code — strip non-printable / non-ASCII chars that would break CODE128B
      const cleanCode = String(code).replace(/[^\x20-\x7E]/g, '').trim();
      if (!cleanCode || cleanCode.length < 3) return null;  // too short to scan reliably
      // Sanitize price — guard against negative or NaN values
      const safePrice = (typeof price === 'number' && isFinite(price) && price >= 0) ? price : null;
      const dept = (deptCode != null && DATA.depts) ? DATA.depts[String(deptCode)] : '';
      return { code: cleanCode, name, price: safePrice, dept, multipack, taxed: !!taxed, sizeStr: sizeStr || '' };
    }).filter(Boolean);

    if (items.length === 0) { showToast('LIST IS EMPTY', true); return; }

    // Stash raw items so doPrintLabels can build the PDF from data, not DOM
    _activePrintList = { name: list.name, items };

    // Reset mode to regular every time labels are opened
    _labelMode = 'regular';
    renderLabelsForMode();

    $('#labels-overlay').classList.add('open');
    document.body.classList.add('body-locked');
    window.scrollTo(0, 0);
  }

  // Current label mode: 'regular' (default) or 'promo' (big 8-per-page)
  let _labelMode = 'regular';

  // Re-render the overlay using the current mode. Called on open and on toggle.
  function renderLabelsForMode() {
    if (!_activePrintList) return;
    const items = _activePrintList.items;
    const isPromo = _labelMode === 'promo';

    const labelsHtml = items.map(item => {
      const size = parseSize(item.name) || parseSize(item.sizeStr || '');
      const unitPrice = item.price != null ? unitPriceString(item.price, size) : '';
      let priceDisplay, priceSize;
      if (item.multipack) {
        priceDisplay = item.multipack;
        priceSize = 'mp';
      } else if (item.price != null) {
        priceDisplay = item.price.toFixed(2);
        priceSize = 'reg';
      } else {
        priceDisplay = '—';
        priceSize = 'reg';
      }

      // Barcode via temporary attached SVG
      let barcodeSvg = '';
      try {
        const holder = document.createElement('div');
        holder.style.position = 'absolute';
        holder.style.left = '-9999px';
        holder.style.top = '0';
        const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        holder.appendChild(tmp);
        document.body.appendChild(holder);
        const ok = renderBarcode(tmp, item.code);
        barcodeSvg = ok ? tmp.outerHTML : `<div class="lbl-nobc">${escapeHtml(item.code)}</div>`;
        document.body.removeChild(holder);
      } catch (e) {
        barcodeSvg = `<div class="lbl-nobc">${escapeHtml(item.code)}</div>`;
      }

      const taxBadge = item.taxed ? '<span class="lbl-tax">+tax</span>' : '';

      if (isPromo) {
        // PROMO layout: SPECIAL! banner + big centered price + name + barcode
        return `
          <div class="label" data-code="${escapeHtml(item.code)}">
            <div class="lbl-banner">SPÉCIAL!</div>
            <div class="lbl-body">
              <div class="lbl-name">${escapeHtml(labelDisplayName(item))}</div>
              <div class="lbl-price-row">
                <div class="lbl-price lbl-price-${priceSize}">${escapeHtml(priceDisplay)}</div>
                ${taxBadge}
              </div>
              ${unitPrice ? `<div class="lbl-unit">${unitPrice}</div>` : ''}
              <div class="lbl-barcode">${barcodeSvg}</div>
            </div>
          </div>
        `;
      } else {
        // REGULAR layout (scaled +25%)
        return `
          <div class="label" data-code="${escapeHtml(item.code)}">
            <div class="lbl-top">
              <div class="lbl-name">${escapeHtml(labelDisplayName(item))}</div>
              <div class="lbl-price-wrap">
                <div class="lbl-price lbl-price-${priceSize}">${escapeHtml(priceDisplay)}</div>
                ${taxBadge}
              </div>
            </div>
            ${unitPrice ? `<div class="lbl-unit">${unitPrice}</div>` : ''}
            <div class="lbl-barcode">${barcodeSvg}</div>
          </div>
        `;
      }
    }).join('');

    const sheet = $('#labels-sheet');
    sheet.classList.toggle('promo', isPromo);
    sheet.innerHTML = labelsHtml;

    const perPage = isPromo ? 8 : 12;
    const pageCount = Math.ceil(items.length / perPage);
    $('#labels-bar-info').textContent =
      `${items.length} ÉTIQUETTE${items.length === 1 ? '' : 'S'} · ${pageCount} PAGE${pageCount === 1 ? '' : 'S'} · ${isPromo ? 'PROMO' : 'RÉGULIER'}`;

    // Update toggle button states
    document.querySelectorAll('#label-mode-toggle .mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === _labelMode);
    });

    if (!isPromo) requestAnimationFrame(fitLabelText);
  }

  function fitLabelText() {
    document.querySelectorAll('.labels-sheet:not(.promo) .label, #print-container:not(.promo) .label').forEach(label => {
      const nameEl = label.querySelector('.lbl-name');
      if (!nameEl) return;
      nameEl.style.fontSize = '';
      nameEl.style.maxHeight = 'none';
      let size = 8.5;
      let guard = 12;
      while (label.scrollHeight > label.clientHeight + 1 && size > 5.5 && guard-- > 0) {
        size -= 0.5;
        nameEl.style.fontSize = size + 'pt';
      }
    });
  }
