<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Décarie" />
<title>Décarie Scanner</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #2a2a2a;
    --text: #f4f4f4;
    --text-dim: #888;
    --text-faint: #555;
    --accent: #d4ff3a;
    --accent-dim: #8aa825;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --font-display: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    overscroll-behavior: none;
    min-height: 100%;
  }
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg); position: sticky; top: 0; z-index: 10;
  }
  .topbar .brand {
    font-family: var(--font-display); font-size: 13px;
    letter-spacing: 0.18em; font-weight: 700; color: var(--accent);
  }
  .topbar .meta {
    font-family: var(--font-display); font-size: 10px;
    color: var(--text-faint); letter-spacing: 0.1em;
  }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    border-bottom: 1px solid var(--border); background: var(--bg);
    position: sticky; top: 67px; z-index: 9;
  }
  .tab {
    padding: 14px 4px; text-align: center;
    font-family: var(--font-display); font-size: 10px;
    letter-spacing: 0.1em; font-weight: 600; color: var(--text-dim);
    background: none; border: none;
    border-bottom: 2px solid transparent; cursor: pointer;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .updated-line {
    padding: 6px 18px;
    font-family: var(--font-display);
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 47px; z-index: 9;
    display: flex;
    justify-content: space-between;
  }
  .updated-line .live { color: var(--accent-dim); }

  #scanner-view, #search-view, #lists-view, #count-view { display: none; padding: 16px; }
  #scanner-view.active, #search-view.active, #lists-view.active, #count-view.active { display: block; }

  .scanner-frame {
    position: relative; width: 100%; aspect-ratio: 4/3;
    background: #000; border: 1px solid var(--border);
    overflow: hidden; border-radius: 4px;
  }
  #scanner-video, #count-video {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }

  .scanner-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .reticle {
    width: 78%; height: 28%; border: 2px solid var(--accent);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); position: relative;
  }
  .reticle::before {
    content: ''; position: absolute; left: 0; right: 0; height: 1px;
    background: var(--accent); opacity: 0.6;
    box-shadow: 0 0 8px var(--accent);
    top: 50%; animation: scan 2s ease-in-out infinite;
  }
  @keyframes scan {
    0%, 100% { top: 10%; opacity: 0.3; }
    50% { top: 90%; opacity: 1; }
  }

  .scanner-controls { margin-top: 14px; display: flex; gap: 8px; }
  .btn {
    padding: 14px 18px; font-family: var(--font-display); font-size: 12px;
    font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: 4px; cursor: pointer; flex: 1;
  }
  .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn.primary:active { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; }
  .btn.small { padding: 8px 12px; font-size: 10px; flex: 0 0 auto; }
  .btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }

  .manual-entry { margin-top: 14px; display: flex; gap: 8px; }
  .manual-entry input {
    flex: 1; padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-display); font-size: 14px;
    border-radius: 4px; outline: none;
  }
  .manual-entry input:focus { border-color: var(--accent); }

  .scanner-status {
    margin-top: 14px; font-family: var(--font-display); font-size: 11px;
    letter-spacing: 0.08em; color: var(--text-dim); text-align: center;
    padding: 8px; border: 1px dashed var(--border); border-radius: 4px;
  }
  .scanner-status.ok { color: var(--good); border-color: var(--good); }
  .scanner-status.err { color: var(--bad); border-color: var(--bad); }

  #search-input {
    width: 100%; padding: 14px 16px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text);
    font-size: 16px; border-radius: 4px; outline: none; margin-bottom: 12px;
  }
  #search-input:focus { border-color: var(--accent); }

  .search-results { display: flex; flex-direction: column; gap: 6px; }
  .search-row {
    padding: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; cursor: pointer; display: flex;
    justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .search-row:active { background: var(--surface-2); }
  .search-row .name { font-size: 14px; font-weight: 500; }
  .search-row .code {
    font-family: var(--font-display); font-size: 10px;
    color: var(--text-faint); margin-top: 2px;
  }
  .search-row .price {
    font-family: var(--font-display); font-size: 13px;
    color: var(--accent); font-weight: 700; white-space: nowrap;
  }
  .search-row .actions {
    display: flex; gap: 4px;
  }

  .modal {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    overflow-y: auto; transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal.open { transform: translateY(0); }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .modal-header .close {
    background: none; border: none; color: var(--text);
    font-size: 28px; cursor: pointer; padding: 0 6px; line-height: 1;
  }
  .modal-header .label {
    font-family: var(--font-display); font-size: 11px;
    color: var(--text-faint); letter-spacing: 0.15em;
  }
  .modal-header .actions {
    display: flex; gap: 8px;
  }

  .modal-content { padding: 0 18px 30px; }

  .product-name {
    font-size: 22px; font-weight: 600; margin: 16px 0 6px; line-height: 1.25;
  }
  .product-meta {
    display: flex; gap: 14px; font-family: var(--font-display);
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.05em; margin-bottom: 18px;
  }
  .product-meta span:not(:last-child)::after {
    content: '/'; margin-left: 14px; color: var(--text-faint);
  }

  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--border); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden; margin-bottom: 24px;
  }
  .stat { background: var(--surface); padding: 14px; }
  .stat .label {
    font-family: var(--font-display); font-size: 10px;
    color: var(--text-dim); letter-spacing: 0.12em; margin-bottom: 6px;
  }
  .stat .value {
    font-family: var(--font-display); font-size: 22px;
    font-weight: 700; color: var(--text); line-height: 1;
  }
  .stat .sub {
    font-family: var(--font-display); font-size: 11px;
    color: var(--text-dim); margin-top: 4px;
  }
  .stat.accent .value { color: var(--accent); }

  .section-title {
    font-family: var(--font-display); font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.15em;
    margin: 24px 0 10px; display: flex;
    justify-content: space-between; align-items: baseline;
  }
  .section-title .hint {
    font-size: 10px; color: var(--text-faint); letter-spacing: 0.05em;
  }

  .chart-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px 8px 8px;
    height: 200px; position: relative;
  }

  .month-table {
    width: 100%; font-family: var(--font-display);
    font-size: 12px; border-collapse: collapse;
  }
  .month-table th {
    text-align: left; color: var(--text-faint); font-weight: 400;
    padding: 8px 6px; font-size: 10px; letter-spacing: 0.08em;
    border-bottom: 1px solid var(--border);
  }
  .month-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
  .month-table tr:last-child td { border-bottom: none; }
  .month-table .num { text-align: right; }
  .month-table .amt { color: var(--accent); font-weight: 600; }
  .month-table .zero { color: var(--text-faint); }
  .month-table .trend { width: 60px; }
  .trend-bar { background: var(--accent); height: 8px; border-radius: 1px; }

  .empty-state {
    padding: 40px 16px; text-align: center; color: var(--text-dim);
    font-family: var(--font-display); font-size: 12px; letter-spacing: 0.08em;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #000; padding: 12px 18px;
    border-radius: 4px; font-family: var(--font-display);
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    opacity: 0; transition: all 0.2s; z-index: 200; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--bad); color: #fff; }

  .recent { margin-top: 22px; }
  .recent-list { display: flex; flex-direction: column; gap: 4px; }
  .recent-item {
    padding: 10px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px;
    font-size: 13px; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center; gap: 8px;
  }
  .recent-item .rname {
    flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .recent-item .ramt {
    font-family: var(--font-display); font-size: 11px;
    color: var(--accent); white-space: nowrap;
  }

  /* ===== LISTS UI ===== */
  .lists-header {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .lists-header input {
    flex: 1; padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text);
    font-size: 14px; border-radius: 4px; outline: none;
  }
  .lists-header input:focus { border-color: var(--accent); }

  .list-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px; margin-bottom: 8px;
    cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  .list-card:active { background: var(--surface-2); }
  .list-card .ltitle { font-size: 15px; font-weight: 600; }
  .list-card .lmeta {
    font-family: var(--font-display); font-size: 10px;
    color: var(--text-dim); letter-spacing: 0.08em; margin-top: 4px;
  }
  .list-card .larrow {
    color: var(--text-faint); font-size: 22px;
  }

  /* Auto label-batch cards */
  .batch-section-label {
    font-family: var(--font-display); font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.1em; margin: 4px 0 8px; font-weight: 700;
  }
  .batch-hint { font-size: 10px; color: var(--text-faint); margin: 2px 0 14px; line-height: 1.4; }
  .list-card.batch-card { border-color: var(--accent); border-left-width: 3px; }
  .batch-badge {
    font-family: var(--font-display); font-size: 8px; font-weight: 700;
    background: var(--accent); color: #000; padding: 2px 5px; border-radius: 3px;
    letter-spacing: 0.06em; vertical-align: middle; margin-left: 4px;
  }
  .list-card.batch-done { opacity: 0.5; border-color: var(--border); }
  .list-card.batch-done .batch-badge { background: var(--text-faint); color: var(--bg); }

  /* List detail view */
  .list-detail-actions {
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .list-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px; margin-bottom: 8px;
  }
  .list-item .li-row1 {
    display: flex; justify-content: space-between; gap: 10px;
    align-items: flex-start; margin-bottom: 8px;
  }
  .list-item .li-name { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .list-item .li-meta {
    font-family: var(--font-display); font-size: 10px;
    color: var(--text-faint); margin-top: 2px;
  }
  .list-item .li-price {
    font-family: var(--font-display); font-size: 14px;
    color: var(--accent); font-weight: 700; white-space: nowrap;
  }
  .list-item .li-price-sub {
    font-family: var(--font-display); font-size: 10px;
    color: var(--text-dim); white-space: nowrap; margin-top: 2px;
  }
  .list-item .li-barcode {
    background: #fff; padding: 8px 4px 2px; border-radius: 3px;
    text-align: center; margin-top: 4px;
  }
  .list-item .li-barcode svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .list-item .li-actions {
    display: flex; gap: 6px; margin-top: 8px;
  }
  .list-item .li-no-barcode {
    background: var(--surface-2); padding: 12px; border-radius: 3px;
    text-align: center; font-family: var(--font-display);
    font-size: 11px; color: var(--text-faint); letter-spacing: 0.08em;
    margin-top: 4px;
  }

  /* ===== RECENT MOMENTUM (highlighted panel) ===== */
  .momentum-panel {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .momentum-panel .mp-title {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-bottom: 10px;
  }
  .momentum-panel .mp-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .momentum-panel .mp-cell .mp-label {
    font-family: var(--font-display);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .momentum-panel .mp-cell .mp-value {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
    line-height: 1;
  }
  .momentum-panel .mp-cell .mp-sub {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .momentum-panel .mp-cell .mp-delta {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    margin-left: 6px;
  }
  .mp-delta.up { color: var(--good); }
  .mp-delta.down { color: var(--bad); }
  .mp-delta.flat { color: var(--text-dim); }
  .momentum-panel .mp-forecast {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .momentum-panel .mp-forecast b { color: var(--text); }

  /* ===== COUNT VIEW ===== */
  .count-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .count-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .count-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
    padding-right: 8px;
  }
  .count-stats {
    display: flex;
    gap: 14px;
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .count-stats b {
    color: var(--accent);
    font-weight: 700;
  }
  .count-stats span:last-child { margin-left: auto; color: var(--accent); font-weight: 700; }

  .count-scanner-frame {
    aspect-ratio: 4/3;
  }
  .count-scanner-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 12px;
    background: rgba(0,0,0,0.7);
    color: var(--text);
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-align: center;
    pointer-events: none;
    display: none;
  }
  .count-scanner-banner.show { display: block; }
  .count-scanner-banner.ok { background: rgba(74, 222, 128, 0.85); color: #000; font-weight: 700; }
  .count-scanner-banner.err { background: rgba(248, 113, 113, 0.9); color: #fff; }

  /* Quantity pad — appears as a modal-style overlay within the count view */
  .count-qty-pad {
    display: none;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 14px;
    margin-top: 12px;
    box-shadow: 0 0 0 4px rgba(212, 255, 58, 0.05);
  }
  .count-qty-pad.show { display: block; }
  .qp-product-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .qp-product-meta {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  /* Numpad qty entry */
  .qp-display {
    text-align: center;
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: 4px;
    padding: 14px 10px;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .qp-numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .qp-key {
    padding: 18px 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .qp-key:active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    transform: scale(0.96);
  }
  .qp-key-fn {
    background: var(--surface);
    color: var(--text-dim);
    font-size: 18px;
  }
  .qp-key-fn:active {
    background: var(--warn);
    color: #000;
  }

  .qp-existing {
    padding: 8px 10px;
    background: rgba(251, 191, 36, 0.1);
    border-left: 2px solid var(--warn);
    border-radius: 2px;
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--warn);
    margin-bottom: 10px;
  }

  .qp-actions {
    display: flex;
    gap: 8px;
  }
  .qp-actions .btn {
    padding: 18px;
    font-size: 14px;
  }

  /* Counted items list */
  .counted-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  .counted-item.confirm-delete {
    background: rgba(248, 113, 113, 0.15);
    border-color: var(--bad);
  }
  .counted-item .ci-info { flex: 1; min-width: 0; }
  .counted-item .ci-name {
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .counted-item .ci-meta {
    font-family: var(--font-display);
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .counted-item .ci-qty {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    min-width: 44px;
    text-align: right;
    line-height: 1;
    padding: 0 4px;
  }
  .counted-item .ci-actions {
    display: flex;
    gap: 8px;
  }
  .counted-item .ci-btn {
    width: 44px; height: 44px;
    padding: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .counted-item .ci-btn:active {
    transform: scale(0.94);
  }
  .counted-item .ci-btn.ci-inc:active { background: var(--accent); color: #000; border-color: var(--accent); }
  .counted-item .ci-btn.ci-dec:active { background: var(--accent-dim); color: #000; border-color: var(--accent-dim); }
  .counted-item .ci-btn.ci-del {
    width: 38px;
    color: var(--text-dim);
    font-size: 18px;
  }
  .counted-item.confirm-delete .ci-btn.ci-del {
    background: var(--bad);
    color: #fff;
    border-color: var(--bad);
  }
  .counted-item .ci-del-hint {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--bad);
    letter-spacing: 0.08em;
    margin-right: 6px;
    display: none;
  }
  .counted-item.confirm-delete .ci-del-hint { display: inline; }
  .counted-item.confirm-delete .ci-inc,
  .counted-item.confirm-delete .ci-dec { display: none; }

  /* Previous count session card */
  .count-session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .count-session-card:active { background: var(--surface-2); }
  .count-session-card .csc-name {
    font-size: 14px;
    font-weight: 600;
  }
  .count-session-card .csc-meta {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .count-session-card.active-session {
    border-left: 3px solid var(--accent);
  }

  /* Daily 14-day grid */
  .daily-grid {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 8px 8px;
    margin-bottom: 18px;
  }
  .dg-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }
  .dg-col.weekend .dg-day { color: var(--accent-dim); }
  .dg-qty {
    font-family: var(--font-display);
    font-size: 9px;
    color: var(--accent);
    font-weight: 700;
    height: 12px;
    line-height: 12px;
    letter-spacing: -0.5px;
  }
  .dg-bar-wrap {
    width: 100%;
    height: 56px;
    background: rgba(255,255,255,0.03);
    border-radius: 2px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .dg-bar {
    width: 100%;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
    border-radius: 2px 2px 0 0;
    min-height: 3px;
  }
  .dg-day {
    font-family: var(--font-display);
    font-size: 8px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .dg-date {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 600;
  }

  /* ===== LABELS OVERLAY (in-app, no popup) =====
     IMPORTANT: this is NOT position:fixed. iOS Safari's print engine treats
     fixed layers as "repeat on every page" and bakes the layout in before
     CSS @media print rules can convert it to static. Instead, when open we
     overlay the rest of the app by stacking via z-index and full-viewport
     dimensions in normal flow (the body itself doesn't scroll while it's
     open, see the .body-locked class). */
  .labels-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #f0f0f0;
    z-index: 300;
  }
  .labels-overlay.open { display: flex; flex-direction: column; }
  body.body-locked { overflow: hidden; }

  /* ── Hidden reports page ── */
  .reports-overlay {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 320;
    flex-direction: column;
  }
  .reports-overlay.open { display: flex; }
  .reports-bar {
    flex: 0 0 auto;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex; flex-direction: column; gap: 10px;
  }
  .reports-bar-row1 {
    display: flex; align-items: center; justify-content: space-between;
  }
  #reports-title {
    font-family: var(--font-display); font-size: 13px;
    color: var(--accent); letter-spacing: 0.12em; font-weight: 700;
  }
  .reports-tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .reports-tabs .rtab {
    flex: 1; background: var(--surface); color: var(--text-dim);
    border: none; padding: 8px 4px; font-family: var(--font-display);
    font-size: 9px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer;
  }
  .reports-tabs .rtab + .rtab { border-left: 1px solid var(--border); }
  .reports-tabs .rtab.active { background: var(--accent); color: #000; }
  .reports-body {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .rpt-section-title {
    font-family: var(--font-display); font-size: 11px; color: var(--accent);
    letter-spacing: 0.1em; margin: 4px 0 10px; font-weight: 700;
  }
  .rpt-sub { color: var(--text-dim); font-size: 11px; margin-bottom: 14px; }
  .rpt-period { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .rpt-period button {
    background: var(--surface); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px; font-family: var(--font-display);
    font-size: 10px; font-weight: 700; cursor: pointer;
  }
  .rpt-period button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .rpt-kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .rpt-kpi {
    flex: 1; min-width: 90px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px;
  }
  .rpt-kpi .k-label { font-family: var(--font-display); font-size: 8.5px; color: var(--text-dim); letter-spacing: 0.06em; }
  .rpt-kpi .k-value { font-family: var(--font-display); font-size: 17px; color: var(--text); font-weight: 700; margin-top: 4px; }
  .rpt-kpi .k-sub { font-size: 9px; color: var(--text-faint); margin-top: 2px; }
  .rpt-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .rpt-table th {
    font-family: var(--font-display); font-size: 8.5px; color: var(--text-dim);
    text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--border);
    letter-spacing: 0.04em; font-weight: 700; white-space: nowrap;
  }
  .rpt-table th:first-child, .rpt-table td:first-child { text-align: left; }
  .rpt-table td { padding: 5px 4px; text-align: right; border-bottom: 1px solid #1c1c1c; color: var(--text); white-space: nowrap; }
  .rpt-table tr.dept-row td { background: #161616; font-weight: 700; color: var(--accent); border-top: 1px solid var(--border); }
  .rpt-table tr.total-row td { font-weight: 700; color: var(--text); border-top: 2px solid var(--border); border-bottom: none; }
  .rpt-table td.pos { color: var(--good); }
  .rpt-table td.neg { color: #f87171; }
  .rpt-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .rpt-chart-wrap { position: relative; height: 260px; margin-bottom: 18px; }
  .rpt-empty { color: var(--text-faint); font-size: 12px; text-align: center; padding: 40px 0; }
  .dept-week-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 14px;
  }
  .dept-week-nav button {
    background: var(--surface); color: var(--accent); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-weight: 700;
  }
  .dept-week-nav button:disabled { color: var(--text-faint); opacity: 0.4; cursor: default; }
  .dept-week-nav .dw-label {
    font-family: var(--font-display); font-size: 12px; color: var(--text);
    font-weight: 700; letter-spacing: 0.04em; text-align: center; flex: 1;
  }

  .labels-bar {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 0 0 auto;
  }
  .labels-bar-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .labels-bar #labels-bar-info {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }
  .labels-bar-actions { display: flex; gap: 8px; }
  .labels-bar .btn { flex: 0 0 auto; }
  #labels-print-btn { width: 100%; }
  .labels-sheet {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 16px;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    justify-content: flex-start;
    align-content: flex-start;
  }
  /* Mode toggle (REGULAR / PROMO / PERF) in labels overlay header */
  .mode-toggle {
    display: flex;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .mode-toggle .mode-btn {
    flex: 1;
    background: var(--surface);
    color: var(--text-dim);
    border: none;
    padding: 9px 4px;
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-toggle .mode-btn + .mode-btn { border-left: 1px solid var(--border); }
  .mode-toggle .mode-btn.active {
    background: var(--accent);
    color: #000;
  }

  /* Regular label — original size 5.0×2.5cm = 12.5 cm² (within QC OPC 9.67–12.9 cm²) */
  .labels-sheet .label, #print-container .label {
    width: 5.0cm;
    height: 2.5cm;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    padding: 2mm 2.5mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    page-break-inside: avoid;
    font-family: Arial, Helvetica, sans-serif;
  }
  .labels-sheet .label .lbl-top, #print-container .label .lbl-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2mm;
  }
  .labels-sheet .label .lbl-name, #print-container .label .lbl-name {
    font-size: 8.5pt;
    font-weight: 700;
    line-height: 1.1;
    flex: 1;
    overflow: hidden;
    word-break: break-word;
  }
  .labels-sheet .label .lbl-price-reg, #print-container .label .lbl-price-reg {
    font-size: 19pt;
    font-weight: 800;
    line-height: 0.9;
    white-space: nowrap;
  }
  .labels-sheet .label .lbl-price-reg::before, #print-container .label .lbl-price-reg::before { content: "$"; font-size: 11pt; vertical-align: super; }
  .labels-sheet .label .lbl-price-mp, #print-container .label .lbl-price-mp {
    font-size: 14pt;
    font-weight: 800;
    line-height: 0.9;
    white-space: nowrap;
  }
  .labels-sheet .label .lbl-price-wrap, #print-container .label .lbl-price-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }
  /* +tax: small, lowercase, black, no background, normal weight.
     Visible but not shouting. */
  .labels-sheet .label .lbl-tax, #print-container .label .lbl-tax {
    font-size: 6pt;
    font-weight: 400;
    color: #000;
    letter-spacing: 0;
    line-height: 1;
  }
  .labels-sheet .label .lbl-unit, #print-container .label .lbl-unit {
    font-size: 8pt;
    font-style: italic;
    font-weight: 600;
    line-height: 1;
  }
  .labels-sheet .label .lbl-barcode, #print-container .label .lbl-barcode {
    text-align: center;
    margin-top: 1mm;
  }
  .labels-sheet .label .lbl-barcode svg, #print-container .label .lbl-barcode svg {
    max-width: 80%;
    height: 0.6cm;
  }
  .labels-sheet .label .lbl-nobc, #print-container .label .lbl-nobc {
    font-family: monospace;
    font-size: 8pt;
    text-align: center;
  }

  /* Promo label — 4× area (about 9.5×6.5cm), 8 per page on letter.
     High-impact: big SPECIAL! banner, oversized price, thick border. */
  .labels-sheet.promo .label, #print-container.promo .label {
    width: 9.5cm;
    height: 6.5cm;
    border: 4px solid #000;
    padding: 0;
    background: #fff;
    position: relative;
  }
  .labels-sheet.promo .label .lbl-banner, #print-container.promo .label .lbl-banner {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: 22pt;
    text-align: center;
    padding: 3mm 2mm;
    letter-spacing: 0.12em;
    line-height: 1;
    font-style: italic;
    transform: skewX(-6deg);
    transform-origin: center;
  }
  .labels-sheet.promo .label .lbl-body, #print-container.promo .label .lbl-body {
    padding: 3mm 4mm;
    display: flex;
    flex-direction: column;
    gap: 1.5mm;
    height: calc(100% - 16mm);
  }
  .labels-sheet.promo .label .lbl-name, #print-container.promo .label .lbl-name {
    font-size: 14pt;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.05;
    text-align: center;
    max-height: 3em;
    overflow: hidden;
  }
  .labels-sheet.promo .label .lbl-price-row, #print-container.promo .label .lbl-price-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3mm;
    margin: 1mm 0;
  }
  .labels-sheet.promo .label .lbl-price-reg, #print-container.promo .label .lbl-price-reg {
    font-size: 48pt;
    font-weight: 900;
    line-height: 0.85;
    color: #000;
  }
  .labels-sheet.promo .label .lbl-price-reg::before, #print-container.promo .label .lbl-price-reg::before {
    content: "$";
    font-size: 28pt;
    vertical-align: super;
  }
  .labels-sheet.promo .label .lbl-price-mp, #print-container.promo .label .lbl-price-mp {
    font-size: 32pt;
    font-weight: 900;
    line-height: 0.85;
    color: #000;
  }
  .labels-sheet.promo .label .lbl-tax, #print-container.promo .label .lbl-tax {
    font-size: 9.5pt;
    background: none;
    color: #000;
    padding: 0;
    border-radius: 0;
    font-weight: 400;
    letter-spacing: 0;
  }
  .labels-sheet.promo .label .lbl-unit, #print-container.promo .label .lbl-unit {
    font-size: 11pt;
    font-style: italic;
    font-weight: 700;
    text-align: center;
  }
  .labels-sheet.promo .label .lbl-barcode, #print-container.promo .label .lbl-barcode {
    text-align: center;
    margin-top: auto;
  }
  .labels-sheet.promo .label .lbl-barcode svg, #print-container.promo .label .lbl-barcode svg {
    max-width: 70%;
    height: 1.3cm;
  }

  /* Print styles for list export */
  @media print {
    .topbar, .tabs, .list-detail-actions, .modal-header, .updated-line { display: none !important; }
    body, html { background: #fff !important; color: #000 !important; }
    .list-item {
      background: #fff !important; border: 1px solid #ccc !important;
      page-break-inside: avoid; margin-bottom: 6px;
    }
    .list-item .li-name { color: #000 !important; }
    .list-item .li-price { color: #000 !important; }
    .list-item .li-meta { color: #555 !important; }
    .list-item .li-actions { display: none !important; }
    .modal { position: static !important; transform: none !important; background: #fff !important; }
    .modal-content { padding: 0 !important; }
  }

  /* The label-printing flow replaces document.body.innerHTML entirely with a
     self-contained print document (see doPrintLabels). No print-time CSS
     needed here for labels — they bring their own stylesheet. */
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">▮▮ MARCHÉ DÉCARIE</div>
  <div class="meta" id="meta-info">— ITEMS</div>
</header>

<div class="updated-line" id="updated-line"></div>

<nav class="tabs">
  <button class="tab active" data-tab="scanner">⌘ SCAN</button>
  <button class="tab" data-tab="search">⌕ SEARCH</button>
  <button class="tab" data-tab="lists">≡ LISTS</button>
  <button class="tab" data-tab="count"># COUNT</button>
</nav>

<section id="scanner-view" class="active">
  <div class="scanner-frame">
    <video id="scanner-video" playsinline autoplay muted></video>
    <div class="scanner-overlay"><div class="reticle"></div></div>
  </div>

  <div class="scanner-controls">
    <button class="btn primary" id="start-btn">START CAMERA</button>
    <button class="btn" id="switch-camera-btn" style="display:none; flex: 0 0 auto;">CAM 1/1</button>
    <button class="btn" id="stop-btn" disabled>STOP</button>
  </div>

  <form class="manual-entry" id="manual-form">
    <input type="text" id="manual-input" placeholder="Or type barcode…" inputmode="numeric" autocomplete="off" />
    <button class="btn" type="submit">GO</button>
  </form>

  <div class="scanner-status" id="status">CAMERA OFF</div>

  <div class="recent" id="recent-section" style="display: none;">
    <div class="section-title">RECENT</div>
    <div class="recent-list" id="recent-list"></div>
  </div>
</section>

<section id="search-view">
  <input type="text" id="search-input" placeholder="Search by name or barcode…" autocomplete="off" />
  <div class="search-results" id="search-results">
    <div class="empty-state">TYPE TO SEARCH PRODUCTS</div>
  </div>
</section>

<section id="lists-view">
  <div class="lists-header">
    <input type="text" id="new-list-name" placeholder="New list name…" autocomplete="off" />
    <button class="btn primary" id="new-list-btn">CREATE</button>
  </div>
  <div id="lists-container">
    <div class="empty-state">NO LISTS YET — CREATE ONE ABOVE</div>
  </div>
</section>

<section id="count-view">
  <!-- When no active session: show "start" UI -->
  <div id="count-start" style="display: none;">
    <div class="lists-header">
      <input type="text" id="new-count-name" placeholder="Count session name (e.g. Charcuterie)" autocomplete="off" />
      <button class="btn primary" id="new-count-btn">START</button>
    </div>
    <div class="section-title">
      <span>PREVIOUS COUNTS</span>
      <span class="hint" id="count-sessions-hint"></span>
    </div>
    <div id="count-sessions-list">
      <div class="empty-state">NO PREVIOUS COUNTS</div>
    </div>
  </div>

  <!-- Active session: scanner + entry pad -->
  <div id="count-active" style="display: none;">
    <div class="count-header">
      <div class="count-title-row">
        <div class="count-title" id="count-session-name">SESSION</div>
        <button class="btn small" id="count-pause-btn">PAUSE</button>
      </div>
      <div class="count-stats">
        <span><b id="count-skus">0</b> SKU<span id="count-skus-plural">S</span></span>
        <span><b id="count-units">0</b> UNITS</span>
        <span id="count-value">$0</span>
      </div>
    </div>

    <div class="scanner-frame count-scanner-frame">
      <video id="count-video" playsinline autoplay muted></video>
      <div class="scanner-overlay"><div class="reticle"></div></div>
      <div class="count-scanner-banner" id="count-banner"></div>
    </div>

    <!-- Quantity entry overlay -->
    <div id="count-qty-pad" class="count-qty-pad">
      <div class="qp-product-name" id="qp-product-name">—</div>
      <div class="qp-product-meta" id="qp-product-meta">—</div>

      <div id="qp-existing-warning" class="qp-existing" style="display: none;"></div>

      <div class="qp-display" id="qp-display">1</div>

      <div class="qp-numpad">
        <button class="qp-key" data-key="1">1</button>
        <button class="qp-key" data-key="2">2</button>
        <button class="qp-key" data-key="3">3</button>
        <button class="qp-key" data-key="4">4</button>
        <button class="qp-key" data-key="5">5</button>
        <button class="qp-key" data-key="6">6</button>
        <button class="qp-key" data-key="7">7</button>
        <button class="qp-key" data-key="8">8</button>
        <button class="qp-key" data-key="9">9</button>
        <button class="qp-key qp-key-fn" data-key="clear">C</button>
        <button class="qp-key" data-key="0">0</button>
        <button class="qp-key qp-key-fn" data-key="back">⌫</button>
      </div>

      <div class="qp-actions">
        <button class="btn" id="qp-cancel">CANCEL</button>
        <button class="btn primary" id="qp-confirm">CONFIRM</button>
      </div>
    </div>

    <div class="count-controls">
